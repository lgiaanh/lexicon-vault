    // Helper to generate a masked gap sentence from an example sentence
    function makeGapSentence(sentence, word, baseVerb, particles, conjugations) {
      if (!sentence) return { masked: '', answer: '', isSeparated: false };
      
      const v = baseVerb ? baseVerb.trim() : '';
      const p = particles ? particles.trim() : '';
      
      if (!v || !p) {
        // Fallback: If no base verb or particles are defined, just blank out the entire phrasal verb phrase
        const wordClean = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&').replace(/\s+/g, '\\s+');
        const r = new RegExp(`\\b${wordClean}\\b`, 'gi');
        if (r.test(sentence)) {
          const masked = sentence.replace(r, '[________]');
          return { masked, answer: word, isSeparated: false };
        }
        return { masked: sentence + " (Answer: " + word + ")", answer: word, isSeparated: false };
      }

      // Gather inflected verb forms
      const verbForms = new Set([
        v.toLowerCase(),
        (v + 's').toLowerCase(),
        (v + 'es').toLowerCase()
      ]);
      
      // Standard inflections fallback
      if (v.toLowerCase() === 'go') {
        verbForms.add('goes'); verbForms.add('going'); verbForms.add('went'); verbForms.add('gone');
      } else if (v.toLowerCase() === 'bring') {
        verbForms.add('brings'); verbForms.add('bringing'); verbForms.add('brought');
      } else if (v.toLowerCase() === 'carry') {
        verbForms.add('carries'); verbForms.add('carrying'); verbForms.add('carried');
      } else if (v.toLowerCase() === 'look') {
        verbForms.add('looks'); verbForms.add('looking'); verbForms.add('looked');
      } else if (v.toLowerCase() === 'put') {
        verbForms.add('putting'); verbForms.add('puts');
      } else if (v.toLowerCase() === 'set') {
        verbForms.add('setting'); verbForms.add('sets');
      } else if (v.toLowerCase() === 'take') {
        verbForms.add('takes'); verbForms.add('taking'); verbForms.add('took'); verbForms.add('taken');
      } else if (v.toLowerCase() === 'get') {
        verbForms.add('gets'); verbForms.add('getting'); verbForms.add('got'); verbForms.add('gotten');
      } else if (v.toLowerCase() === 'call') {
        verbForms.add('calls'); verbForms.add('calling'); verbForms.add('called');
      } else if (v.toLowerCase() === 'run') {
        verbForms.add('runs'); verbForms.add('running'); verbForms.add('ran');
      } else if (v.toLowerCase() === 'keep') {
        verbForms.add('keeps'); verbForms.add('keeping'); verbForms.add('kept');
      } else if (v.toLowerCase() === 'make') {
        verbForms.add('makes'); verbForms.add('making'); verbForms.add('made');
      } else if (v.toLowerCase() === 'give') {
        verbForms.add('gives'); verbForms.add('giving'); verbForms.add('gave'); verbForms.add('given');
      } else if (v.toLowerCase() === 'come') {
        verbForms.add('comes'); verbForms.add('coming'); verbForms.add('came');
      } else if (v.toLowerCase() === 'break') {
        verbForms.add('breaks'); verbForms.add('breaking'); verbForms.add('broke'); verbForms.add('broken');
      } else if (v.toLowerCase() === 'turn') {
        verbForms.add('turns'); verbForms.add('turning'); verbForms.add('turned');
      } else if (v.toLowerCase() === 'hold') {
        verbForms.add('holds'); verbForms.add('holding'); verbForms.add('held');
      } else if (v.toLowerCase() === 'fall') {
        verbForms.add('falls'); verbForms.add('falling'); verbForms.add('fell'); verbForms.add('fallen');
      }

      if (conjugations) {
        if (conjugations.present_participle) verbForms.add(conjugations.present_participle.toLowerCase().trim());
        if (conjugations.past_tense) verbForms.add(conjugations.past_tense.toLowerCase().trim());
        if (conjugations.past_participle) verbForms.add(conjugations.past_participle.toLowerCase().trim());
      }

      const sortedVerbs = Array.from(verbForms).filter(Boolean).sort((a, b) => b.length - a.length);

      // 1. Check for non-separated matching (e.g. "look forward to" contiguous)
      const pRegexEscaped = p.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&').replace(/\s+/g, '\\s+');
      const vRegexGroup = sortedVerbs.map(form => '\\b' + form.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\b').join('|');
      const contiguousRegex = new RegExp(`(${vRegexGroup})(\\s+)(${pRegexEscaped})`, 'gi');

      if (contiguousRegex.test(sentence)) {
        let actualMatch = '';
        const masked = sentence.replace(contiguousRegex, (match) => {
          actualMatch = match;
          return '[________]';
        });
        return { masked, answer: actualMatch, isSeparated: false };
      }

      // 2. Check for separated matching (e.g. "put [something] down to")
      const particleRegex = new RegExp(`\\b${pRegexEscaped}\\b`, 'gi');
      const pMatch = particleRegex.exec(sentence);
      if (pMatch) {
        const pIndex = pMatch.index;
        const beforePart = sentence.slice(0, pIndex);
        const afterPart = sentence.slice(pIndex + pMatch[0].length);

        const verbRegex = new RegExp(`(${vRegexGroup})`, 'gi');
        let vMatch;
        let lastVMatch = null;
        // Search for the last verb occurrence before the particle
        while ((vMatch = verbRegex.exec(beforePart)) !== null) {
          lastVMatch = vMatch;
        }

        if (lastVMatch) {
          const vIndex = lastVMatch.index;
          const vWord = lastVMatch[0];
          const pWord = pMatch[0];

          const masked = beforePart.slice(0, vIndex) + '[____]' + beforePart.slice(vIndex + vWord.length) + '[________]' + afterPart;
          return {
            masked,
            answer: `${vWord} ... ${pWord}`,
            isSeparated: true,
            answerVerb: vWord,
            answerParticle: pWord
          };
        }
      }

      // 3. Fallback: just mask the base verb form
      const fallbackRegex = new RegExp(`\\b(${vRegexGroup})\\b`, 'gi');
      if (fallbackRegex.test(sentence)) {
        let actualMatch = '';
        const masked = sentence.replace(fallbackRegex, (match) => {
          actualMatch = match;
          return '[____]';
        });
        return { masked: masked, answer: actualMatch, isSeparated: false };
      }

      return { masked: sentence + " (" + word + ")", answer: word, isSeparated: false };
    }

    function clozeMaskSentence(sentence, word) {
      if (!sentence || !word) return '';
      const escapedWord = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
      
      if (word.includes(' ')) {
        const parts = word.split(/\s+/).map(p => p.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
        const firstPart = parts[0];
        const restParts = parts.slice(1).join('\\s+');
        const pattern = `\\b${firstPart}(ing|ed|s|es|d)?\\s+${restParts}\\b`;
        const regex = new RegExp(pattern, 'gi');
        if (regex.test(sentence)) {
          return sentence.replace(regex, '[________]');
        }
      }
      
      const regex = new RegExp(`\\b${escapedWord}(ing|ed|s|es|d)?\\b`, 'gi');
      if (regex.test(sentence)) {
        return sentence.replace(regex, '[________]');
      }
      
      const simpleRegex = new RegExp(escapedWord, 'gi');
      if (simpleRegex.test(sentence)) {
        return sentence.replace(simpleRegex, '[________]');
      }
      
      return sentence;
    }

    function highlightWordReact(sentence, word) {
      if (!sentence || !word) return <span>{sentence}</span>;
      
      const escaped = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
      let pattern = `\\b${escaped}(ing|ed|s|es|d)?\\b`;
      if (word.includes(' ')) {
        const parts = word.split(/\s+/).map(p => p.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
        const firstPart = parts[0];
        const restParts = parts.slice(1).join('\\s+');
        pattern = `\\b${firstPart}(ing|ed|s|es|d)?\\s+${restParts}\\b`;
      }
      
      try {
        const regex = new RegExp(`(${pattern})`, 'gi');
        const parts = sentence.split(regex);
        return (
          <span>
            {parts.map((part, i) => {
              const isMatch = regex.test(part);
              return isMatch ? (
                <strong key={i} style={{ color: 'var(--accent)', textDecoration: 'underline', textUnderlineOffset: '3px' }}>
                  {part}
                </strong>
              ) : (
                part
              );
            })}
          </span>
        );
      } catch (e) {
        return <span>{sentence}</span>;
      }
    }

    function App() {
      // Load initial states from localStorage if they exist, otherwise use prefilled data
      const [entries, setEntries] = useState(() => {
        const saved = localStorage.getItem('lexicon_entries');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            let modified = false;
            const updated = parsed.map(entry => {
              if (!entry || typeof entry !== 'object') return entry;
              if (!entry.collocations) {
                const entryWord = (entry.word || '').toLowerCase();
                if (!entryWord) {
                  modified = true;
                  return { ...entry, collocations: [] };
                }
                const match = INITIAL_ENTRIES.find(e => e.word.toLowerCase() === entryWord) ||
                              EXTENDED_DICTIONARY_DB.find(e => e.word.toLowerCase() === entryWord);
                if (match && match.collocations) {
                  modified = true;
                  return { ...entry, collocations: match.collocations };
                } else {
                  modified = true;
                  return { ...entry, collocations: [] };
                }
              }
              return entry;
            });
            if (modified) {
              localStorage.setItem('lexicon_entries', JSON.stringify(updated));
            }
            return updated;
          } catch (e) {
            console.error("Failed to parse lexicon_entries", e);
            return INITIAL_ENTRIES;
          }
        }
        return INITIAL_ENTRIES;
      });

      const [folders, setFolders] = useState(() => {
        const saved = localStorage.getItem('lexicon_folders');
        let loaded = INITIAL_FOLDERS;
        if (saved) {
          try {
            loaded = JSON.parse(saved);
          } catch (e) {
            console.error("Failed to parse lexicon_folders", e);
            loaded = INITIAL_FOLDERS;
          }
        }
        // Ensure folder-6 exists in the loaded folders array
        const hasFolder6 = loaded.some(f => f.id === 'folder-6');
        if (!hasFolder6) {
          const folder6 = INITIAL_FOLDERS.find(f => f.id === 'folder-6');
          if (folder6) {
            loaded.push(folder6);
          }
        }
        // Ensure folder-science exists in the loaded folders array
        const hasFolderScience = loaded.some(f => f.id === 'folder-science');
        if (!hasFolderScience) {
          const folderScience = INITIAL_FOLDERS.find(f => f.id === 'folder-science');
          if (folderScience) {
            loaded.push(folderScience);
          }
        }
        return loaded;
      });

      // UI State
      const [activeTab, setActiveTab] = useState('vault'); // 'vault' | 'graph' | 'review'
      const [selectedFolderId, setSelectedFolderId] = useState(null); // null means "All Words"
      const [groupByFamily, setGroupByFamily] = useState(true);
       const [searchQuery, setSearchQuery] = useState('');
      
      // Article Analyzer state
      const [articles, setArticles] = useState(() => {
        const saved = localStorage.getItem('lexicon_articles');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            const existingIds = new Set(parsed.map(a => a.id));
            const missingArticles = INITIAL_ARTICLES.filter(a => !existingIds.has(a.id));
            return [...parsed, ...missingArticles];
          } catch (e) {
            console.error("Failed to parse lexicon_articles", e);
            return INITIAL_ARTICLES;
          }
        }
        return INITIAL_ARTICLES;
      });

      const [activeArticleId, setActiveArticleId] = useState(() => {
        const initial = INITIAL_ARTICLES && INITIAL_ARTICLES.length > 0 ? INITIAL_ARTICLES[0].id : null;
        const saved = localStorage.getItem('lexicon_articles');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.length > 0) return parsed[0].id;
          } catch (e) {}
        }
        return initial;
      });

      const [isAddingNew, setIsAddingNew] = useState(false);

      // Get logical study date (starts at 2:00 AM)
      const getStudyDateString = (dateObj = new Date()) => {
        const hours = dateObj.getHours();
        if (hours < 2) {
          const prev = new Date(dateObj);
          prev.setDate(prev.getDate() - 1);
          return prev.toISOString().split('T')[0];
        }
        return dateObj.toISOString().split('T')[0];
      };

      const getYesterdayDateString = (dateStr) => {
        const d = new Date(dateStr + 'T12:00:00');
        d.setDate(d.getDate() - 1);
        return d.toISOString().split('T')[0];
      };

      // Daily study timer state (resets logical day at 2:00 AM)
      const [studyTimeToday, setStudyTimeToday] = useState(() => {
        const studyDateStr = getStudyDateString();
        const saved = localStorage.getItem('lexicon_study_time');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.date === studyDateStr) {
              return parsed.seconds || 0;
            }
          } catch (e) {}
        }
        return 0;
      });

      // Total study time accumulated
      const [totalStudyTime, setTotalStudyTime] = useState(() => {
        const saved = localStorage.getItem('lexicon_total_study_time');
        return saved ? parseInt(saved) || 0 : 0;
      });

      // Streak count calculation
      const [streakCount, setStreakCount] = useState(() => {
        const savedStreak = localStorage.getItem('lexicon_study_streak');
        if (savedStreak) {
          try {
            const streakObj = JSON.parse(savedStreak);
            const studyDateStr = getStudyDateString();
            if (streakObj.lastStudyDate === studyDateStr) {
              return streakObj.streak || 0;
            }
            const yesterdayStr = getYesterdayDateString(studyDateStr);
            if (streakObj.lastStudyDate === yesterdayStr) {
              return streakObj.streak || 0;
            }
            return 0; // Broke streak
          } catch (e) {}
        }
        return 0;
      });

      const checkAndUpdateStreak = (studyDateStr) => {
        const savedStreak = localStorage.getItem('lexicon_study_streak');
        let streakObj = { streak: 0, lastStudyDate: '' };
        if (savedStreak) {
          try {
            streakObj = JSON.parse(savedStreak);
          } catch (e) {}
        }
        
        if (streakObj.lastStudyDate === studyDateStr) {
          return;
        }
        
        const yesterdayStr = getYesterdayDateString(studyDateStr);
        if (streakObj.lastStudyDate === yesterdayStr) {

      // Helper to generate word families programmatically
      const generateWordFamily = (word, pos) => {
        let verb = [];
        let noun = [];
        let adj = [];
        let adv = [];

        const clean = word.toLowerCase().trim();

        if (pos === 'transitive verb' || pos === 'intransitive verb' || pos.includes('verb')) {
          verb = [clean];
          if (clean.endsWith('ate')) {
            noun = [clean.replace(/ate$/, 'ation')];
            adj = [clean.replace(/ate$/, 'ative')];
            adv = [clean.replace(/ate$/, 'atively')];
          } else if (clean.endsWith('ize') || clean.endsWith('ise')) {
            noun = [clean.replace(/[is]ze$/, 'isation')];
            adj = [clean.replace(/[is]ze$/, 'ising')];
            adv = [clean.replace(/[is]ze$/, 'isingly')];
          } else if (clean.endsWith('ify')) {
            noun = [clean.replace(/ify$/, 'ification')];
            adj = [clean.replace(/ify$/, 'ifying')];
            adv = [clean.replace(/ify$/, 'ifyingly')];
          } else {
            noun = [clean + 'ment', clean + 'tion'];
            adj = [clean + 'ive', clean + 'able'];
            adv = [clean + 'ively'];
          }
        } else if (pos === 'noun') {
          noun = [clean];
          if (clean.endsWith('tion')) {
            verb = [clean.replace(/tion$/, 'te'), clean.replace(/ation$/, 'ate'), clean.replace(/tion$/, '')];
            adj = [clean.replace(/tion$/, 'tive')];
            adv = [clean.replace(/tion$/, 'tively')];
          } else if (clean.endsWith('ment')) {
            verb = [clean.replace(/ment$/, '')];
            adj = [clean.replace(/ment$/, 'tal')];
            adv = [clean.replace(/ment$/, 'tally')];
          } else if (clean.endsWith('ness')) {
            adj = [clean.replace(/ness$/, 'y'), clean.replace(/ness$/, '')];
            verb = [];
            adv = [clean.replace(/ness$/, 'ly')];
          } else if (clean.endsWith('ity')) {
            adj = [clean.replace(/ity$/, 'ic'), clean.replace(/ity$/, 'al'), clean.replace(/ity$/, 'e')];
            verb = [clean.replace(/ity$/, 'ify')];
            adv = [clean.replace(/ity$/, 'ically')];
          } else {
            adj = [clean + 'al', clean + 'ic'];
            adv = [clean + 'ally'];
          }
        } else if (pos === 'adjective') {
          adj = [clean];
          if (clean.endsWith('able') || clean.endsWith('ible')) {

        setIsEditModalOpen(false);
        setEditingEntry(null);
      };

      // Delete Entry from vault
      const handleDeleteEntry = (entryId, wordText) => {
        if (confirm(`Are you sure you want to permanently delete "${wordText}" from the vault?`)) {
          setEntries(prev => prev.filter(e => e.id !== entryId));
          showToastGlobal(`"${wordText}" deleted.`);
        }
      };

      // Open edit folder modal helper
      const openEditFolderModal = (folderObj) => {
        setEditingFolder(folderObj);
        setNewFolderName(folderObj.name);
        setNewFolderColor(folderObj.color);
        setNewFolderEmoji(folderObj.emoji || '🎓');
        setNewFolderDescription(folderObj.description || '');
        
        // Find all entries currently in this folder
        const selected = entries.filter(e => e.folder_ids.includes(folderObj.id)).map(e => e.id);
        setNewFolderSelectedWords(selected);
        setBulkSearchQuery('');
        
        setIsFolderModalOpen(true);
      };

      // Folder creation and editing
      const handleCreateFolder = () => {
        if (!newFolderName.trim()) return;

        if (editingFolder) {
          // Edit Mode
          const folderId = editingFolder.id;
          if (folders.some(f => f.id !== folderId && f.name.toLowerCase() === newFolderName.toLowerCase().trim())) {
            alert('A folder with that name already exists.');
            return;
          }

          setFolders(prev => prev.map(f => {
            if (f.id === folderId) {
              return {
                ...f,
                name: newFolderName.trim(),
                color: newFolderColor,
                emoji: newFolderEmoji,
                description: newFolderDescription.trim()
              };
            }
            return f;
          }));

          // Synchronize folder assignments
          setEntries(prev => prev.map(entry => {
            const hasFolder = entry.folder_ids.includes(folderId);
            const shouldHaveFolder = newFolderSelectedWords.includes(entry.id);
            if (shouldHaveFolder && !hasFolder) {
              return { ...entry, folder_ids: [...entry.folder_ids, folderId] };
            } else if (!shouldHaveFolder && hasFolder) {
              return { ...entry, folder_ids: entry.folder_ids.filter(id => id !== folderId) };
            }
            return entry;
          }));

          showToastGlobal(`Folder "${newFolderEmoji} ${newFolderName.trim()}" updated successfully.`);
        } else {
          // Create Mode
          if (folders.some(f => f.name.toLowerCase() === newFolderName.toLowerCase().trim())) {
            alert('A folder with that name already exists.');
            return;
          }

          const newFolderId = `folder-${Date.now()}`;
          const folderObj = {
            id: newFolderId,
            name: newFolderName.trim(),
            color: newFolderColor,
            emoji: newFolderEmoji,
            description: newFolderDescription.trim(),
            created_at: new Date().toISOString(),
            word_count: newFolderSelectedWords.length
          };

          if (newFolderSelectedWords.length > 0) {
            setEntries(prev => prev.map(entry => {
              if (newFolderSelectedWords.includes(entry.id)) {
                const updatedFolders = entry.folder_ids.includes(newFolderId)
                  ? entry.folder_ids
                  : [...entry.folder_ids, newFolderId];
                return { ...entry, folder_ids: updatedFolders };
              }
              return entry;
            }));
          }

          setFolders(prev => [...prev, folderObj]);
          showToastGlobal(`Folder "${folderObj.emoji} ${folderObj.name}" created with ${newFolderSelectedWords.length} words assigned.`);
        }

        // Reset state
        setNewFolderName('');
        setNewFolderColor('#FAEDCB');
        setNewFolderEmoji('🎓');
        setNewFolderDescription('');
        setNewFolderSelectedWords([]);
        setBulkSearchQuery('');
        setEditingFolder(null);
        setIsFolderModalOpen(false);
      };

      // Delete Folder
      const handleDeleteFolder = (folderId, folderName) => {
        if (confirm(`Are you sure you want to delete the folder "${folderName}"? Word entries themselves will NOT be deleted.`)) {
          setFolders(prev => prev.filter(f => f.id !== folderId));
          
          setEntries(prev => prev.map(entry => {
            if (entry.folder_ids.includes(folderId)) {
              return {
                ...entry,
                folder_ids: entry.folder_ids.filter(id => id !== folderId)
              };
            }
            return entry;
          }));

          if (selectedFolderId === folderId) {
            setSelectedFolderId(null);
          }
          showToastGlobal(`Folder "${folderName}" deleted.`);
        }
      };

      // Filtered vocabulary list
      const filteredEntries = useMemo(() => {
        return entries.filter(entry => {
          if (selectedFolderId && !entry.folder_ids.includes(selectedFolderId)) {
            return false;
          }
          if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase().trim();
            const matchesWord = entry.word.toLowerCase().includes(query);
            const matchesDef = entry.definition.toLowerCase().includes(query);
            const matchesField = entry.semantic_field_label.toLowerCase().includes(query);
            if (!matchesWord && !matchesDef && !matchesField) return false;
          }
          if (filterCefr !== 'ALL' && entry.cefr_level !== filterCefr) {
            return false;
          }
          if (filterRegister !== 'ALL' && entry.register !== filterRegister) {
            return false;
          }
          if (filterType !== 'ALL' && entry.entry_type !== filterType) {

      const navigateToWord = (wordText) => {

                      const todayStr = new Date().toISOString().split('T')[0];
                      const matched = entries.filter(entry => {

                        if (reviewFilterFolder !== 'ALL' && (!entry.folder_ids || !entry.folder_ids.includes(reviewFilterFolder))) return false;
                        if (reviewFilterType !== 'ALL' && entry.entry_type !== reviewFilterType) return false;
                        if (reviewFilterCefr !== 'ALL' && entry.cefr_level !== reviewFilterCefr) return false;
                        if (reviewFilterDueOnly && entry.review.due_date > todayStr) return false;
                        return true;
                      });

                      const totalMatched = matched.length;
                      const dueMatched = matched.filter(e => e.review.due_date <= todayStr).length;

                      const handleStartSession = () => {
                        const shuffled = [...matched].sort(() => Math.random() - 0.5);
                        setReviewQueue(shuffled);
                        setCurrentReviewIndex(0);
                        setIsCardRevealed(false);
                        setIsReviewSessionStarted(true);

                        <>
                          <div className="review-stat-summary">
                            <div className="review-stat-item">
                              <span className="review-stat-val">{totalMatched}</span>
                              <span className="review-stat-lbl">Matching Cards</span>

                            <div className="review-stat-item">
                              <span className="review-stat-val">{dueMatched}</span>
                              <span className="review-stat-lbl">Due Today</span>
                            </div>
                          </div>

                          <button 
                            className="btn btn-primary review-start-btn" 
                            disabled={totalMatched === 0}
                            onClick={handleStartSession}

                            {totalMatched === 0 ? 'No Cards Match Filters' : 'Start Review Session'}
                          </button>

                          {/* 7-DAY STUDY FORECAST */}
                          {(() => {
                            const forecastCards = entries.filter(entry => {
                              if (!entry.review) return false;
                              if (entry.is_learned) return false;
                              if (reviewFilterFolder !== 'ALL' && (!entry.folder_ids || !entry.folder_ids.includes(reviewFilterFolder))) return false;
                              if (reviewFilterType !== 'ALL' && entry.entry_type !== reviewFilterType) return false;
                              if (reviewFilterCefr !== 'ALL' && entry.cefr_level !== reviewFilterCefr) return false;
                              return true;
                            });

                            const forecastDays = [];
                            const todayObj = new Date();
                            
                            for (let i = 0; i < 7; i++) {
                              const d = new Date(todayObj);
                              d.setDate(todayObj.getDate() + i);
                              const dateStr = d.toISOString().split('T')[0];
                              
                              let label = '';
                              if (i === 0) label = 'Today';
                              else if (i === 1) label = 'Tomorrow';
                              else label = d.toLocaleDateString('en-US', { weekday: 'short' });
                              
                              const fullLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                              
                              const dueCards = forecastCards.filter(e => {
                                if (i === 0) {
                                  return e.review.due_date <= dateStr;
                                } else {
                                  return e.review.due_date === dateStr;
                                }
                              });
                              
                              forecastDays.push({
                                dateStr,
                                label,
                                fullLabel,
                                cards: dueCards,
                                count: dueCards.length

                                      <div className="forecast-card-date">{day.fullLabel}</div>

    // ----------------------------------------------------
    // CARD COMPONENT - Render Single Entry View
    // ----------------------------------------------------
    function WordCard({ entry, folders, speakWord, speechActiveWord, navigateToWord, onEdit, onDelete, vaultEntries }) {
      const [showAllExamples, setShowAllExamples] = useState(false);

      const checkWordInVault = (wordName) => {
        return vaultEntries.some(e => e.word.toLowerCase() === wordName.toLowerCase());
      };

      const semanticChips = useMemo(() => {
        if (!entry.semantic_field_words || entry.semantic_field_words.length === 0) return [];
        return entry.semantic_field_words;
      }, [entry]);

      const synonymChips = useMemo(() => {
        if (!entry.register_synonyms || entry.register_synonyms.length === 0) return [];
        return entry.register_synonyms;
      }, [entry]);

      return (
        <article className="word-card">
          <div className="card-top">
            <div className="card-title-group">
              <h2 className="word-title">{entry.word}</h2>
              {entry.entry_type !== 'word' && (
                <span className="entry-type-label">
                  {entry.entry_type.replace('_', ' ')}
                </span>
              )}
              {entry.grammar_note && <span className="grammar-note">{entry.grammar_note}</span>}
            </div>

            <div className="card-actions">
              <button className="card-action-btn" onClick={onEdit} title="Edit Details">
                <Icon name="edit" style={{ width: '0.9em', height: '0.9em' }} />
              </button>
              <button className="card-action-btn" style={{ color: '#EF4444' }} onClick={onDelete} title="Delete Word">
                <Icon name="trash" style={{ width: '0.9em', height: '0.9em' }} />
              </button>
            </div>
          </div>

          <div className="pronunciation-row">

    // Helper to extract all lowercase words associated with a family
    const getFamilyWords = (entry) => {
      const words = new Set();
      words.add(entry.word.toLowerCase().trim());
      if (entry.word_family) {
        ['noun', 'verb', 'adjective', 'adverb'].forEach(pos => {
          const list = entry.word_family[pos];
          if (Array.isArray(list)) {
            list.forEach(w => words.add(w.toLowerCase().trim()));
          }
        });
      }
      return words;
    };

    // Helper to group entries into word families based on overlapping family words
    const groupEntriesByFamily = (entriesList) => {
      const groups = []; // Array of { representative: string, entries: Entry[] }
      
      entriesList.forEach(entry => {
        const entryFamily = getFamilyWords(entry);
        
        let targetGroup = null;
        for (const group of groups) {
          const sharesConnection = group.entries.some(ge => {
            const geFamily = getFamilyWords(ge);
            for (const w of entryFamily) {
              if (geFamily.has(w)) return true;
            }
            return false;
          });
          
          if (sharesConnection) {
            targetGroup = group;
            break;
          }
        }
        
        if (targetGroup) {
          targetGroup.entries.push(entry);
        } else {
          groups.push({
            representative: entry.word,
            entries: [entry]
          });
        }
      });
      
      groups.forEach(g => {
        g.entries.sort((a, b) => a.word.localeCompare(b.word));
        g.representative = g.entries[0].word;
      });
      
      groups.sort((a, b) => a.representative.localeCompare(b.representative));
      return groups;
    };

                {
                  definition: activeEntry.definition,
                  example: activeEntry.example,
                  cefr_level: activeEntry.cefr_level,
                  grammar_note: activeEntry.grammar_note
                }
              ];

              return defs.map((d, index) => (
                <div key={index} className="meaning-item" style={{
                  borderLeft: '2px solid var(--border-strong)',
                  paddingLeft: '10px',
                  display: 'flex',
                  flexDirection: 'column',
                  gap: '4px'
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                    <span style={{ fontWeight: 'bold', fontSize: '14px', color: 'var(--accent)' }}>
                      {defs.length > 1 ? `${index + 1}. ` : ''}
                    </span>
                    {d.grammar_note && (
                      <span className="grammar-note" style={{ fontStyle: 'italic', fontSize: '12px', color: 'var(--text-muted)' }}>
                        ({d.grammar_note})
                      </span>
                    )}
                    {d.cefr_level && (
                      <span className={`badge badge-cefr-${d.cefr_level.toLowerCase()}`} style={{ fontSize: '9px', padding: '1px 4px', textTransform: 'uppercase' }}>
                        {d.cefr_level}
                      </span>
                    )}
                  </div>
                  <p className="definition-text" style={{ fontSize: '13.5px', margin: 0 }}>
                    {d.definition}
                    {index === 0 && <span className="cambridge-attribution"> — Cambridge Dictionary</span>}
                  </p>
                  {d.example && (
                    <div className="example-sentence" style={{ fontSize: '13px', marginTop: '2px' }}>
                      {d.example}
                    </div>
                  )}
                </div>
              ));
            })()}
          </div>

          {/* COLLOCATIONS SECTION */}
          {activeEntry.collocations && activeEntry.collocations.length > 0 && (
            <div className="collocations-section" style={{ marginTop: '8px', marginBottom: '8px', padding: '10px', backgroundColor: 'var(--bg-app)', borderRadius: '6px', borderLeft: '3px solid var(--accent)' }}>
              <div style={{ fontWeight: 'bold', fontSize: '12px', color: 'var(--text-main)', marginBottom: '6px', textAlign: 'left' }}>Collocations</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                {activeEntry.collocations.map((c, i) => (
                  <div key={i} style={{ fontSize: '13px', lineHeight: '1.4', textAlign: 'left' }}>
                    • <strong>{c.collocation}</strong> {c.example && <span style={{ color: 'var(--text-muted)', fontStyle: 'italic' }}>— {c.example}</span>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Word Family chips list inside the active entry */}
          {activeEntry.entry_type === 'word' && activeEntry.word_family && (
            <div className="word-family-section">
              <div className="word-family-label">Full Word Family</div>
              <div className="word-family-chips">
                {['verb', 'noun', 'adjective', 'adverb'].map((pos, idx) => {
                  const words = activeEntry.word_family[pos];
                  if (!words || words.length === 0) return null;
                  
                  const posAbbr = pos === 'verb' ? 'vb' : pos === 'noun' ? 'nn' : pos === 'adjective' ? 'adj' : 'adv';
                  
                  return (
                    <span key={pos} className="word-family-chip">
                      <span className="word-family-pos">{posAbbr}:</span>
                      {words.map((w, wIdx) => {
                        const isSaved = checkWordInVault(w);
                        const isActive = w.toLowerCase() === activeEntry.word.toLowerCase();
                        const groupMember = group.entries.find(e => e.word.toLowerCase() === w.toLowerCase());
                        return (
                          <span 
                            key={wIdx} 
                            className="word-family-word clickable"
                            style={{ 
                              fontWeight: isActive || isSaved ? '700' : '400',
                              color: isActive ? 'var(--accent)' : (isSaved ? 'var(--text-main)' : 'inherit'),
                              textDecoration: isActive || isSaved ? 'none' : 'underline',
                              textDecorationStyle: 'dotted'
                            }}
                            onClick={() => {
                              if (groupMember) {
                                setActiveWordId(groupMember.id);
                              } else {
                                navigateToWord(w);
                              }
                            }}
                            title={groupMember ? `Switch to "${w}" tab` : (isSaved ? `View "${w}" in vault` : `"${w}" is not in vault. Click to lookup and add it!`)}
                          >
                            {w}{wIdx < words.length - 1 ? ', ' : ''}
                          </span>
                        );
                      })}
                      {idx < 3 && <span className="word-family-separator">|</span>}
                    </span>
                  );
                })}
              </div>
            </div>
          )}

          {/* Related Phrasal Forms (if phrasal verb) */}
          {activeEntry.entry_type === 'phrasal_verb' && activeEntry.related_phrasal_verbs && activeEntry.related_phrasal_verbs.length > 0 && (
            <div className="word-family-section">
              <div className="word-family-label">Related Phrasal Forms ({activeEntry.base_verb})</div>
              <div className="word-family-chips">
                {activeEntry.related_phrasal_verbs.map((pv, idx) => {
                  const isSaved = checkWordInVault(pv);
                  return (
                    <span key={pv} className="word-family-chip">
                      <span 
                        className={`word-family-word ${isSaved ? 'clickable' : ''}`}
                        style={{ fontWeight: isSaved ? '600' : 'normal', color: pv.toLowerCase() === activeEntry.word.toLowerCase() ? 'var(--accent)' : 'inherit' }}
                        onClick={() => navigateToWord(pv)}
                        title={isSaved ? `View "${pv}" in vault` : `Click to add "${pv}"`}
                      >
                        {pv}
                      </span>
                      {idx < activeEntry.related_phrasal_verbs.length - 1 && <span className="word-family-separator">|</span>}
                    </span>
                  );
                })}
              </div>
            </div>
          )}

          {/* Semantic Field Synonyms Section */}
          {semanticChips.length > 0 && (
            <div className="synonyms-section">
              <div className="synonyms-label">Theme Vocabulary ({activeEntry.semantic_field_label})</div>
              <div className="synonyms-chips">
                {semanticChips.slice(0, 12).map(item => {
                  const isSaved = checkWordInVault(item.word);
                  return (
                    <div 
                      key={item.word}
                      className="synonym-chip clickable"
                      onClick={() => navigateToWord(item.word)}
                      title={isSaved ? `View "${item.word}" in vault` : `Click to look up "${item.word}"`}
                    >
                      {isSaved && <span className="in-vault-dot"></span>}
                      <span style={{ fontWeight: isSaved ? '600' : 'normal' }}>{item.word}</span>
                      <span className="synonym-meta">{item.register} ({item.cefr})</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Register Synonyms Section */}
          {synonymChips.length > 0 && (
            <div className="synonyms-section">
              <div className="synonyms-label">Register Synonyms</div>
              <div className="synonyms-chips">
                {synonymChips.map(item => {
                  const isSaved = checkWordInVault(item.word);
                  return (
                    <div 
                      key={item.word}
                      className="synonym-chip clickable"
                      onClick={() => navigateToWord(item.word)}
                      title={isSaved ? `View "${item.word}" in vault` : `Click to look up "${item.word}"`}
                    >
                      {isSaved && <span className="in-vault-dot"></span>}
                      <span style={{ fontWeight: isSaved ? '600' : 'normal' }}>{item.word}</span>
                      <span className="synonym-meta">{item.register} ({item.cefr})</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {activeEntry.folder_ids && activeEntry.folder_ids.length > 0 && (
            <div className="card-folder-tags" style={{ marginTop: '12px' }}>
              {activeEntry.folder_ids.map(id => {
                const folderObj = folders.find(f => f.id === id);
                if (!folderObj) return null;
                return (
                  <span 
                    key={id} 
                    className="card-folder-tag" 
                    style={{ backgroundColor: folderObj.color }}
                  >
                    {folderObj.emoji ? (
                      <span style={{ marginRight: '4px' }}>{folderObj.emoji}</span>
                    ) : (
                      <Icon name="folder" style={{ marginRight: '4px', width: '0.9em', height: '0.9em' }} />
                    )}
                    {folderObj.name}
                  </span>
                );
              })}
            </div>
          )}

          {/* LEARNING STATISTICS SECTION */}
          {(() => {
            const stats = activeEntry.stats || { encounters: 0, correct: 0, incorrect: 0 };
            const correctPercent = stats.encounters > 0 ? Math.round((stats.correct / stats.encounters) * 100) : 0;
            const incorrectPercent = stats.encounters > 0 ? Math.round((stats.incorrect / stats.encounters) * 100) : 0;

            return (
              <div className="card-stats-section" style={{
                marginTop: '16px',
                padding: '10px 14px',
                backgroundColor: 'var(--bg-card-hover)',
                border: '1px solid var(--border-muted)',
                borderRadius: '8px',
                fontSize: '12px'
              }}>
                <div style={{ fontWeight: '700', color: 'var(--text-muted)', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px', display: 'flex', alignItems: 'center', gap: '4px' }}>
                  <Icon name="brain" style={{ width: '14px', height: '14px' }} /> Learning Statistics
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10px', textAlign: 'center' }}>
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <span style={{ fontSize: '14px', fontWeight: '800', color: 'var(--text-main)' }}>{stats.encounters}</span>
                    <span style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Encounters</span>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <span style={{ fontSize: '14px', fontWeight: '800', color: '#10B981' }}>
                      {stats.correct} <span style={{ fontSize: '10px', fontWeight: 'normal', color: 'var(--text-muted)' }}>({correctPercent}%)</span>
                    </span>
                    <span style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Correct</span>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <span style={{ fontSize: '14px', fontWeight: '800', color: '#F43F5E' }}>
                      {stats.incorrect} <span style={{ fontSize: '10px', fontWeight: 'normal', color: 'var(--text-muted)' }}>({incorrectPercent}%)</span>
                    </span>
                    <span style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Incorrect</span>
                  </div>
                </div>
              </div>
            );
          })()}
        </article>
      );
    }

    // ----------------------------------------------------
    // DIALOG: EDIT CARD MODAL COMPONENT
    // ----------------------------------------------------
    function EditEntryModal({ entry, folders, onClose, onSave }) {
      const [word, setWord] = useState(entry.word);
      const [definitions, setDefinitions] = useState(entry.definitions && entry.definitions.length > 0 ? entry.definitions : [
        {
          definition: entry.definition || '',
          example: entry.example || '',
          cefr_level: entry.cefr_level || 'B2',
          grammar_note: entry.grammar_note || ''
        }
      ]);
      const [ipaUk, setIpaUk] = useState(entry.ipa_uk);
      const [ipaUs, setIpaUs] = useState(entry.ipa_us);
      const [grammar, setGrammar] = useState(entry.grammar_note);
      const [cefr, setCefr] = useState(entry.cefr_level);
      const [reg, setReg] = useState(entry.register);
      const [formality, setFormality] = useState(entry.formality_score);
      const [connotation, setConnotation] = useState(entry.connotation);
      const [entryType, setEntryType] = useState(entry.entry_type);
      const [assignedFolders, setAssignedFolders] = useState(entry.folder_ids || []);

      const [semLabel, setSemLabel] = useState(entry.semantic_field_label || '');
      const [semId, setSemId] = useState(entry.semantic_field_id || '');

      const [rawExtraExamples, setRawExtraExamples] = useState((entry.extra_examples || []).join('\n'));

      const [familyVerb, setFamilyVerb] = useState((entry.word_family?.verb || []).join(', '));
      const [familyNoun, setFamilyNoun] = useState((entry.word_family?.noun || []).join(', '));
      const [familyAdjective, setFamilyAdjective] = useState((entry.word_family?.adjective || []).join(', '));
      const [familyAdverb, setFamilyAdverb] = useState((entry.word_family?.adverb || []).join(', '));

      const [baseVerb, setBaseVerb] = useState(entry.base_verb || '');
      const [particles, setParticles] = useState(entry.particles || '');
      const [relatedPhrasals, setRelatedPhrasals] = useState((entry.related_phrasal_verbs || []).join(', '));
      const [collocations, setCollocations] = useState(entry.collocations || []);

      const addCollocation = () => {
        setCollocations(prev => [...prev, { collocation: '', example: '' }]);
      };

      const updateCollocation = (index, key, value) => {
        setCollocations(prev => prev.map((c, idx) => idx === index ? { ...c, [key]: value } : c));
      };

      const removeCollocation = (index) => {
        setCollocations(prev => prev.filter((_, idx) => idx !== index));
      };

      const handleUpdate = () => {
        const wordFamilyObj = entryType === 'word' ? {
          verb: familyVerb.split(',').map(s => s.trim()).filter(Boolean),
          noun: familyNoun.split(',').map(s => s.trim()).filter(Boolean),
          adjective: familyAdjective.split(',').map(s => s.trim()).filter(Boolean),
          adverb: familyAdverb.split(',').map(s => s.trim()).filter(Boolean)
        } : null;

        const extraEx = rawExtraExamples.split('\n').map(s => s.trim()).filter(Boolean);

        const relatedPv = relatedPhrasals.split(',').map(s => s.trim()).filter(Boolean);

        const defs = definitions.length > 0 ? definitions : [
          {
            definition: '',
            example: '',
            cefr_level: cefr || 'B2',
            grammar_note: grammar || ''
          }
        ];

        const updated = {
          ...entry,
          word,
          definitions: defs,
          definition: defs[0].definition,
          example: defs[0].example,
          cefr_level: defs[0].cefr_level,
          grammar_note: defs[0].grammar_note,
          ipa_uk: ipaUk,
          ipa_us: ipaUs,
          register: reg,
          formality_score: parseInt(formality),
          connotation,
          entry_type: entryType,
          folder_ids: assignedFolders,
          extra_examples: extraEx,
          semantic_field_id: semId || 'general-academic',
          semantic_field_label: semLabel || 'General Academic',
          word_family: wordFamilyObj,
          base_verb: baseVerb,
          particles: particles,
          related_phrasal_verbs: relatedPv,
          collocations: collocations.filter(c => c.collocation.trim() !== '')
        };

        onSave(updated);
      };

      return (
        <div className="modal-overlay">
          <div className="modal-content modal-content-large">
            <div className="modal-header">
              <h3 className="modal-title">Edit Vault Entry</h3>
              <button className="modal-close-btn" onClick={onClose}>
                <Icon name="times" />
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Vocabulary Entry Word/Phrase</label>
                  <input type="text" className="form-input" value={word} onChange={(e) => setWord(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Entry Type</label>
                  <select className="form-select" value={entryType} onChange={(e) => setEntryType(e.target.value)}>
                    <option value="word">Word</option>
                    <option value="phrasal_verb">Phrasal Verb</option>
                    <option value="idiom">Idiom</option>
                    <option value="collocation">Collocation</option>
                  </select>
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">IPA UK</label>
                  <input type="text" className="form-input" value={ipaUk} onChange={(e) => setIpaUk(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">IPA US</label>
                  <input type="text" className="form-input" value={ipaUs} onChange={(e) => setIpaUs(e.target.value)} />
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Grammar Notes</label>
                  <input type="text" className="form-input" value={grammar} onChange={(e) => setGrammar(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">CEFR Band</label>
                  <select className="form-select" value={cefr} onChange={(e) => setCefr(e.target.value)}>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                    <option value="C1">C1</option>
                    <option value="C2">C2</option>
                  </select>
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Register Domain</label>
                  <select className="form-select" value={reg} onChange={(e) => setReg(e.target.value)}>
                    <option value="neutral">neutral</option>
                    <option value="informal">informal</option>
                    <option value="formal">formal</option>
                    <option value="academic">academic</option>
                    <option value="business">business</option>
                    <option value="journalism">journalism</option>
                    <option value="legal">legal</option>
                    <option value="literary">literary</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Formality Score</label>
                  <select className="form-select" value={formality} onChange={(e) => setFormality(e.target.value)}>
                    <option value={1}>F1/5</option>
                    <option value={2}>F2/5</option>
                    <option value={3}>F3/5</option>
                    <option value={4}>F4/5</option>
                    <option value={5}>F5/5</option>
                  </select>
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Connotation Tone</label>
                  <select className="form-select" value={connotation} onChange={(e) => setConnotation(e.target.value)}>
                    <option value="positive">positive</option>
                    <option value="neutral">neutral</option>
                    <option value="negative">negative</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Semantic Field ID Slug</label>
                  <input type="text" className="form-input" value={semId} onChange={(e) => setSemId(e.target.value)} />
                </div>
              </div>

              <div className="form-group">
                <label className="form-label">Semantic Field Label</label>
                <input type="text" className="form-input" value={semLabel} onChange={(e) => setSemLabel(e.target.value)} />
              </div>

              <div className="form-group">
                <label className="form-label" style={{ fontWeight: 'bold', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span>Meanings & Senses ({definitions.length})</span>
                  <button
                    type="button"
                    className="btn btn-secondary"
                    style={{ padding: '2px 6px', fontSize: '11px' }}
                    onClick={() => {
                      setDefinitions(prev => [
                        ...prev,
                        {
                          definition: '',
                          example: '',
                          cefr_level: cefr || 'B2',
                          grammar_note: grammar || ''
                        }
                      ]);
                    }}
                  >
                    + Add Meaning
                  </button>
                </label>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', maxHeight: '200px', overflowY: 'auto', border: '1px solid var(--border-muted)', padding: '10px', backgroundColor: '#F8FAFC' }}>
                  {definitions.map((d, index) => (
                    <div key={index} style={{ borderBottom: index < definitions.length - 1 ? '1px dashed var(--border-muted)' : 'none', paddingBottom: '10px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <strong style={{ fontSize: '12px', color: 'var(--accent)' }}>Sense #{index + 1}</strong>
                        {definitions.length > 1 && (
                          <button
                            type="button"
                            className="btn btn-danger"
                            style={{ padding: '1px 6px', fontSize: '10px' }}
                            onClick={() => {
                              setDefinitions(prev => prev.filter((_, i) => i !== index));
                            }}
                          >
                            Remove
                          </button>
                        )}
                      </div>
                      <div className="form-row">
                        <div className="form-group" style={{ flex: 1 }}>
                          <label className="form-label" style={{ fontSize: '11px' }}>CEFR</label>
                          <select
                            className="form-select"
                            style={{ padding: '4px', fontSize: '11px' }}
                            value={d.cefr_level || 'B2'}
                            onChange={(e) => {
                              const next = [...definitions];
                              next[index].cefr_level = e.target.value;
                              setDefinitions(next);
                            }}
                          >
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                          </select>
                        </div>
                        <div className="form-group" style={{ flex: 2 }}>
                          <label className="form-label" style={{ fontSize: '11px' }}>Grammar Note</label>
                          <input
                            type="text"
                            className="form-input"
                            style={{ padding: '4px 8px', fontSize: '11px' }}
                            placeholder="e.g. transitive verb"
                            value={d.grammar_note || ''}
                            onChange={(e) => {
                              const next = [...definitions];
                              next[index].grammar_note = e.target.value;
                              setDefinitions(next);
                            }}
                          />
                        </div>
                      </div>
                      <div className="form-group">
                        <label className="form-label" style={{ fontSize: '11px' }}>Definition</label>
                        <textarea
                          className="form-textarea"
                          rows="2"
                          style={{ padding: '4px 8px', fontSize: '12px' }}
                          placeholder="Definition text..."
                          value={d.definition || ''}
                          onChange={(e) => {
                            const next = [...definitions];
                            next[index].definition = e.target.value;
                            setDefinitions(next);
                          }}
                        />
                      </div>
                      <div className="form-group">
                        <label className="form-label" style={{ fontSize: '11px' }}>Example Sentence</label>
                        <textarea
                          className="form-textarea"
                          rows="2"
                          style={{ padding: '4px 8px', fontSize: '12px' }}
                          placeholder="Example sentence..."
                          value={d.example || ''}
                          onChange={(e) => {
                            const next = [...definitions];
                            next[index].example = e.target.value;
                            setDefinitions(next);
                          }}
                        />
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="form-group">
                <label className="form-label">Extra Examples (one per line)</label>
                <textarea className="form-textarea" rows="3" value={rawExtraExamples} onChange={(e) => setRawExtraExamples(e.target.value)}></textarea>
              </div>

              <div className="form-group" style={{ border: '1px dashed var(--border-strong)', padding: '12px', borderRadius: '6px', marginTop: '12px', marginBottom: '12px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                  <label className="form-label" style={{ fontWeight: 'bold', margin: 0 }}>Collocations</label>
                  <button type="button" className="btn btn-secondary btn-sm" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={addCollocation}>
                    + Add Collocation
                  </button>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {collocations.map((c, index) => (
                    <div key={index} style={{ padding: '10px', border: '1px solid var(--border-muted)', borderRadius: '6px', display: 'flex', flexDirection: 'column', gap: '6px', backgroundColor: 'var(--bg-app)' }}>
                      <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                        <input
                          type="text"
                          className="form-input"
                          style={{ flex: 1, padding: '4px 8px', fontSize: '12px' }}
                          placeholder="Collocation (e.g. strong association)"
                          value={c.collocation || ''}

                        <button

                          className="btn btn-danger"
                          style={{ padding: '4px 8px', fontSize: '11px' }}
