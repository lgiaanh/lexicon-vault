    // Helper to generate a masked gap sentence from an example sentence
    function makeGapSentence(sentence, word, baseVerb, particles, conjugations) {
      if (!sentence) return { masked: '', answer: '', isSeparated: false };
      
      const v = baseVerb ? baseVerb.trim() : '';
      const p = particles ? particles.trim() : '';
      
      if (!v || !p) {
        // Fallback: If no base verb or particles are defined, just blank out the entire phrasal verb phrase
        const wordClean = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&').replace(/\s+/g, '\\s+');
        const r = new RegExp(`\\b${wordClean}\\b`, 'gi');
        if (r.test(sentence)) {
          const masked = sentence.replace(r, '[________]');
          return { masked, answer: word, isSeparated: false };
        }
        return { masked: sentence + " (Answer: " + word + ")", answer: word, isSeparated: false };
      }

      // Gather inflected verb forms
      const verbForms = new Set([
        v.toLowerCase(),
        (v + 's').toLowerCase(),
        (v + 'es').toLowerCase()
      ]);
      
      // Standard inflections fallback
      if (v.toLowerCase() === 'go') {
        verbForms.add('goes'); verbForms.add('going'); verbForms.add('went'); verbForms.add('gone');
      } else if (v.toLowerCase() === 'bring') {
        verbForms.add('brings'); verbForms.add('bringing'); verbForms.add('brought');
      } else if (v.toLowerCase() === 'carry') {
        verbForms.add('carries'); verbForms.add('carrying'); verbForms.add('carried');
      } else if (v.toLowerCase() === 'look') {
        verbForms.add('looks'); verbForms.add('looking'); verbForms.add('looked');
      } else if (v.toLowerCase() === 'put') {
        verbForms.add('putting'); verbForms.add('puts');
      } else if (v.toLowerCase() === 'set') {
        verbForms.add('setting'); verbForms.add('sets');
      } else if (v.toLowerCase() === 'take') {
        verbForms.add('takes'); verbForms.add('taking'); verbForms.add('took'); verbForms.add('taken');
      } else if (v.toLowerCase() === 'get') {
        verbForms.add('gets'); verbForms.add('getting'); verbForms.add('got'); verbForms.add('gotten');
      } else if (v.toLowerCase() === 'call') {
        verbForms.add('calls'); verbForms.add('calling'); verbForms.add('called');
      } else if (v.toLowerCase() === 'run') {
        verbForms.add('runs'); verbForms.add('running'); verbForms.add('ran');
      } else if (v.toLowerCase() === 'keep') {
        verbForms.add('keeps'); verbForms.add('keeping'); verbForms.add('kept');
      } else if (v.toLowerCase() === 'make') {
        verbForms.add('makes'); verbForms.add('making'); verbForms.add('made');
      } else if (v.toLowerCase() === 'give') {
        verbForms.add('gives'); verbForms.add('giving'); verbForms.add('gave'); verbForms.add('given');
      } else if (v.toLowerCase() === 'come') {
        verbForms.add('comes'); verbForms.add('coming'); verbForms.add('came');
      } else if (v.toLowerCase() === 'break') {
        verbForms.add('breaks'); verbForms.add('breaking'); verbForms.add('broke'); verbForms.add('broken');
      } else if (v.toLowerCase() === 'turn') {
        verbForms.add('turns'); verbForms.add('turning'); verbForms.add('turned');
      } else if (v.toLowerCase() === 'hold') {
        verbForms.add('holds'); verbForms.add('holding'); verbForms.add('held');
      } else if (v.toLowerCase() === 'fall') {
        verbForms.add('falls'); verbForms.add('falling'); verbForms.add('fell'); verbForms.add('fallen');
      }

      if (conjugations) {
        if (conjugations.present_participle) verbForms.add(conjugations.present_participle.toLowerCase().trim());
        if (conjugations.past_tense) verbForms.add(conjugations.past_tense.toLowerCase().trim());
        if (conjugations.past_participle) verbForms.add(conjugations.past_participle.toLowerCase().trim());
      }

      const sortedVerbs = Array.from(verbForms).filter(Boolean).sort((a, b) => b.length - a.length);

      // 1. Check for non-separated matching (e.g. "look forward to" contiguous)
      const pRegexEscaped = p.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&').replace(/\s+/g, '\\s+');
      const vRegexGroup = sortedVerbs.map(form => '\\b' + form.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\b').join('|');
      const contiguousRegex = new RegExp(`(${vRegexGroup})(\\s+)(${pRegexEscaped})`, 'gi');

      if (contiguousRegex.test(sentence)) {
        let actualMatch = '';
        const masked = sentence.replace(contiguousRegex, (match) => {
          actualMatch = match;
          return '[________]';
        });
        return { masked, answer: actualMatch, isSeparated: false };
      }

      // 2. Check for separated matching (e.g. "put [something] down to")
      const particleRegex = new RegExp(`\\b${pRegexEscaped}\\b`, 'gi');
      const pMatch = particleRegex.exec(sentence);
      if (pMatch) {
        const pIndex = pMatch.index;
        const beforePart = sentence.slice(0, pIndex);
        const afterPart = sentence.slice(pIndex + pMatch[0].length);

        const verbRegex = new RegExp(`(${vRegexGroup})`, 'gi');
        let vMatch;
        let lastVMatch = null;
        // Search for the last verb occurrence before the particle
        while ((vMatch = verbRegex.exec(beforePart)) !== null) {
          lastVMatch = vMatch;
        }

        if (lastVMatch) {
          const vIndex = lastVMatch.index;
          const vWord = lastVMatch[0];
          const pWord = pMatch[0];

          const masked = beforePart.slice(0, vIndex) + '[____]' + beforePart.slice(vIndex + vWord.length) + '[________]' + afterPart;
          return {
            masked,
            answer: `${vWord} ... ${pWord}`,
            isSeparated: true,
            answerVerb: vWord,
            answerParticle: pWord
          };
        }
      }

      // 3. Fallback: just mask the base verb form
      const fallbackRegex = new RegExp(`\\b(${vRegexGroup})\\b`, 'gi');
      if (fallbackRegex.test(sentence)) {
        let actualMatch = '';
        const masked = sentence.replace(fallbackRegex, (match) => {
          actualMatch = match;
          return '[____]';
        });
        return { masked: masked, answer: actualMatch, isSeparated: false };
      }

      return { masked: sentence + " (" + word + ")", answer: word, isSeparated: false };
    }

    function App() {
      // Load initial states from localStorage if they exist, otherwise use prefilled data
      const [entries, setEntries] = useState(() => {
        const saved = localStorage.getItem('lexicon_entries');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            console.error("Failed to parse lexicon_entries", e);
            return INITIAL_ENTRIES;
          }
        }
        return INITIAL_ENTRIES;
      });

      const [folders, setFolders] = useState(() => {
        const saved = localStorage.getItem('lexicon_folders');
        let loaded = INITIAL_FOLDERS;
        if (saved) {
          try {
            loaded = JSON.parse(saved);
          } catch (e) {
            console.error("Failed to parse lexicon_folders", e);
            loaded = INITIAL_FOLDERS;
          }
        }
        // Ensure folder-6 exists in the loaded folders array
        const hasFolder6 = loaded.some(f => f.id === 'folder-6');
        if (!hasFolder6) {
          const folder6 = INITIAL_FOLDERS.find(f => f.id === 'folder-6');
          if (folder6) {
            loaded.push(folder6);
          }
        }
        // Ensure folder-science exists in the loaded folders array
        const hasFolderScience = loaded.some(f => f.id === 'folder-science');
        if (!hasFolderScience) {
          const folderScience = INITIAL_FOLDERS.find(f => f.id === 'folder-science');
          if (folderScience) {
            loaded.push(folderScience);
          }
        }
        return loaded;
      });

      // UI State
      const [activeTab, setActiveTab] = useState('vault'); // 'vault' | 'graph' | 'review'
      const [selectedFolderId, setSelectedFolderId] = useState(null); // null means "All Words"
      const [groupByFamily, setGroupByFamily] = useState(true);
       const [searchQuery, setSearchQuery] = useState('');
      
      // Article Analyzer state
      const [articles, setArticles] = useState(() => {
        const saved = localStorage.getItem('lexicon_articles');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            const existingIds = new Set(parsed.map(a => a.id));
            const missingArticles = INITIAL_ARTICLES.filter(a => !existingIds.has(a.id));
            return [...parsed, ...missingArticles];
          } catch (e) {
            console.error("Failed to parse lexicon_articles", e);
            return INITIAL_ARTICLES;
          }
        }
        return INITIAL_ARTICLES;
      });

      const [activeArticleId, setActiveArticleId] = useState(() => {
        const initial = INITIAL_ARTICLES && INITIAL_ARTICLES.length > 0 ? INITIAL_ARTICLES[0].id : null;
        const saved = localStorage.getItem('lexicon_articles');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.length > 0) return parsed[0].id;
          } catch (e) {}
        }
        return initial;
      });

      const [isAddingNew, setIsAddingNew] = useState(false);

      // Daily study timer state
      const [studyTimeToday, setStudyTimeToday] = useState(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const saved = localStorage.getItem('lexicon_study_time');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.date === todayStr) {
              return parsed.seconds || 0;
            }
          } catch (e) {}
        }
        return 0;
      });

      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const lastActivityTime = useRef(Date.now());

      // Filters
      const [filterCefr, setFilterCefr] = useState('ALL');
      const [filterRegister, setFilterRegister] = useState('ALL');
      const [filterType, setFilterType] = useState('ALL');

      // Review Mode state
      const [isReviewSessionStarted, setIsReviewSessionStarted] = useState(false);
      const [reviewFilterFolder, setReviewFilterFolder] = useState('ALL');
      const [reviewFilterType, setReviewFilterType] = useState('ALL');
      const [reviewFilterCefr, setReviewFilterCefr] = useState('ALL');
      const [reviewFilterDueOnly, setReviewFilterDueOnly] = useState(true);
      const [reviewQueue, setReviewQueue] = useState([]);
      const [currentReviewIndex, setCurrentReviewIndex] = useState(0);
      const [isCardRevealed, setIsCardRevealed] = useState(false);

      const [speechActiveWord, setSpeechActiveWord] = useState(null); // Tracks active pronunciation

      // Modals state
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
      const [editingEntry, setEditingEntry] = useState(null);
      const [editingFolder, setEditingFolder] = useState(null);

      // New folder form state
      const [newFolderName, setNewFolderName] = useState('');
      const [newFolderColor, setNewFolderColor] = useState('#FAEDCB');
      const [newFolderEmoji, setNewFolderEmoji] = useState('🎓');
      const [newFolderDescription, setNewFolderDescription] = useState('');
      const [newFolderSelectedWords, setNewFolderSelectedWords] = useState([]);
      const [bulkSearchQuery, setBulkSearchQuery] = useState('');

      // Search/Lookup input in modal
      const [lookupWord, setLookupWord] = useState('');
      const [lookupResults, setLookupResults] = useState(null);
      const [isSearchingLookup, setIsSearchingLookup] = useState(false);
      const [lookupError, setLookupError] = useState('');

      // Manual entry overrides in Add Modal
      const [customDefinitions, setCustomDefinitions] = useState([]);
      const [customDefinition, setCustomDefinition] = useState('');
      const [customExample, setCustomExample] = useState('');

      const [customFamilyAdjective, setCustomFamilyAdjective] = useState('');
      const [customFamilyAdverb, setCustomFamilyAdverb] = useState('');

      const [suggestedFolder, setSuggestedFolder] = useState('');

      // Toast State
      const [toasts, setToasts] = useState([]);

      // Verification states for importing and new words
      const [pendingImports, setPendingImports] = useState([]);
      const [wordFamilyVerifyData, setWordFamilyVerifyData] = useState(null);

      // Track activity to implement idle detection (60 seconds threshold)
      useEffect(() => {
        const handleActivity = () => {
          lastActivityTime.current = Date.now();
        };

        window.addEventListener('mousemove', handleActivity);
        window.addEventListener('keydown', handleActivity);
        window.addEventListener('click', handleActivity);
        window.addEventListener('scroll', handleActivity);

        return () => {
          window.removeEventListener('mousemove', handleActivity);
          window.removeEventListener('keydown', handleActivity);
          window.removeEventListener('click', handleActivity);
          window.removeEventListener('scroll', handleActivity);
        };
      }, []);

      // Active study modules check
      const isActivelyStudying = useMemo(() => {
        const inReview = activeTab === 'review' && isReviewSessionStarted;
        const inPractice = activeTab === 'practice';
        // Study in analyzer reader view, excluding document upload view
        const inAnalyzer = activeTab === 'analyzer' && activeArticleId && !isAddingNew;

        return inReview || inPractice || inAnalyzer;
      }, [activeTab, isReviewSessionStarted, activeArticleId, isAddingNew]);

      // Timer effect
      useEffect(() => {
        let interval = null;
        
        if (isActivelyStudying) {
          setIsTimerRunning(true);
          interval = setInterval(() => {
            const isIdle = Date.now() - lastActivityTime.current > 60000;
            if (!isIdle) {
              setStudyTimeToday(prev => {
                const nextSecs = prev + 1;
                const todayStr = new Date().toISOString().split('T')[0];
                localStorage.setItem('lexicon_study_time', JSON.stringify({ date: todayStr, seconds: nextSecs }));
                return nextSecs;
              });
              setIsTimerRunning(true);
            } else {
              setIsTimerRunning(false);
            }
          }, 1000);
        } else {
          setIsTimerRunning(false);
        }

        return () => {
          if (interval) clearInterval(interval);
        };
      }, [isActivelyStudying]);

      // Format study timer display (e.g. 1h 12m 4s or 12m 4s or 4s)
      const formatStudyTime = (totalSeconds) => {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;
        
        if (hrs > 0) {
          return `${hrs}h ${mins}m ${secs}s`;

        if (mins > 0) {

      const calculateSM2 = (quality, currentReview) => {
        let ease = currentReview.ease_factor;
        let count = currentReview.repetition_count;
        let interval = currentReview.interval_days;

        if (quality === 'again') {
          interval = 1;
          count = 0;
          ease = Math.max(1.3, ease - 0.2);
        } else if (quality === 'hard') {
          if (count === 0) {
            interval = 2;
          } else if (count === 1) {
            interval = 3;
          } else {
            interval = Math.max(interval + 1, Math.round(interval * 1.2));
          }
          count += 1;
          ease = Math.max(1.3, ease - 0.15);
        } else if (quality === 'good') {
          if (count === 0) {
            interval = 4;
          } else if (count === 1) {
            interval = 6;
          } else {
            interval = Math.max(interval + 2, Math.round(interval * ease));
          }
          count += 1;
        } else if (quality === 'easy') {
          if (count === 0) {
            interval = 7;
          } else if (count === 1) {
            interval = 10;

            interval = Math.max(interval + 3, Math.round(interval * ease * 1.3));
          }
          count += 1;
          ease = Math.min(3.0, ease + 0.15);

        if (interval < 1) interval = 1;
        if (interval > 180) interval = 180;

        const d = new Date();
        d.setDate(d.getDate() + interval);

        if (pos === 'transitive verb' || pos === 'intransitive verb' || pos.includes('verb')) {

          } else if (clean.endsWith('ize') || clean.endsWith('ise')) {
            noun = [clean.replace(/[is]ze$/, 'isation')];
            adj = [clean.replace(/[is]ze$/, 'ising')];
            adv = [clean.replace(/[is]ze$/, 'isingly')];
          } else if (clean.endsWith('ify')) {

        } else if (pos === 'noun') {

            adv = [clean.replace(/tion$/, 'tively')];
          } else if (clean.endsWith('ment')) {
            verb = [clean.replace(/ment$/, '')];
            adj = [clean.replace(/ment$/, 'tal')];
            adv = [clean.replace(/ment$/, 'tally')];
          } else if (clean.endsWith('ness')) {
            adj = [clean.replace(/ness$/, 'y'), clean.replace(/ness$/, '')];
            verb = [];
            adv = [clean.replace(/ness$/, 'ly')];
          } else if (clean.endsWith('ity')) {
            adj = [clean.replace(/ity$/, 'ic'), clean.replace(/ity$/, 'al'), clean.replace(/ity$/, 'e')];
            verb = [clean.replace(/ity$/, 'ify')];
            adv = [clean.replace(/ity$/, 'ically')];
          } else {
            adj = [clean + 'al', clean + 'ic'];
            adv = [clean + 'ally'];
          }
        } else if (pos === 'adjective') {
          adj = [clean];
          if (clean.endsWith('able') || clean.endsWith('ible')) {
            noun = [clean.replace(/able$/, 'ability'), clean.replace(/ible$/, 'ibility')];
            verb = [clean.replace(/able$/, ''), clean.replace(/ible$/, '')];
            adv = [clean + 'y'];
          } else if (clean.endsWith('ive')) {
            noun = [clean.replace(/ive$/, 'ion'), clean.replace(/ive$/, 'ivity')];
            verb = [clean.replace(/ive$/, 'e'), clean.replace(/ive$/, 'ate')];
            adv = [clean + 'ly'];
          } else if (clean.endsWith('ful')) {
            noun = [clean.replace(/ful$/, 'fulness')];
            adv = [clean + 'ly'];
          } else if (clean.endsWith('al')) {
            noun = [clean.replace(/al$/, 'ality')];

            noun = [clean + 'ness'];

        return {

      // Rule-based morphological offline generation for arbitrary lookups
      const generateOfflineEntry = (word) => {

          const particleKeywords = ['up', 'off', 'out', 'down', 'away', 'in', 'on', 'through', 'about', 'forward', 'along'];

        } else {
          if (word.endsWith('ate') || word.endsWith('ise') || word.endsWith('ize') || word.endsWith('ify')) {

          } else if (word.endsWith('tion') || word.endsWith('ment') || word.endsWith('ence') || word.endsWith('ance') || word.endsWith('ity') || word.endsWith('ness') || word.endsWith('ism')) {
            grammar = 'noun';

            grammar = 'adverb';
          }

          if (word.startsWith('de') || word.startsWith('dis') || word.startsWith('mal') || word.startsWith('un') || word.startsWith('im') || word.startsWith('in') || word.startsWith('mis')) {
            const negativeRoots = ['degrad', 'deplet', 'deterior', 'exacerb', 'revok', 'dearth', 'scarc', 'deficit', 'excess'];
            if (negativeRoots.some(r => word.includes(r))) {
              connotation = 'negative';
            }
          } else if (word.startsWith('bene') || word.startsWith('pro') || word.startsWith('co') || word.startsWith('amelior') || word.startsWith('mitig') || word.startsWith('sustain') || word.startsWith('facilit')) {
            connotation = 'positive';
          }

          const ecoKeywords = ['environ', 'eco', 'sustain', 'climate', 'green', 'renew', 'resource', 'pollut', 'carbon'];
          const lawKeywords = ['legal', 'court', 'act', 'bill', 'reform', 'policy', 'clause', 'legislat', 'amend', 'repeal', 'govern'];
          const econKeywords = ['trade', 'budget', 'tax', 'financ', 'econom', 'market', 'fiscal', 'deficit', 'surplus', 'rate', 'corporat'];

          if (ecoKeywords.some(kw => word.includes(kw))) {
            folderName = 'Environment & Ecology';
            semId = 'environment-climate';
            semLabel = 'Environment & Climate';
          } else if (lawKeywords.some(kw => word.includes(kw))) {
            folderName = 'Law & Policy';
            semId = 'law-legislation';
            semLabel = 'Law & Legislation';
          } else if (econKeywords.some(kw => word.includes(kw))) {
            folderName = 'Economics & Statistics';
            semId = 'quantity-abundance';
            semLabel = 'Quantity & Abundance';
          }
        }

        let def = '';
        let ex = '';
        let def2 = '';
        let ex2 = '';
        if (type === 'word') {
          if (grammar.includes('verb')) {
            def = `To perform an action that relates to ${word} (generated offline, click edit to customize).`;
            ex = `The government tried to ${word} the administrative procedures to save time.`;
            def2 = `To cause, facilitate, or adapt a state or system related to ${word} in academic or professional contexts.`;
            ex2 = `New developments may further ${word} the growth of local industries.`;
          } else if (grammar === 'noun') {
            def = `The state, quality, or process of ${word} (generated offline, click edit to customize).`;
            ex = `We are investigating the long-term impact of ${word} on society.`;
            def2 = `A specific instance, occurrence, or concrete product of ${word} inside a structured system.`;
            ex2 = `The paper details several examples of this particular ${word} in action.`;
          } else if (grammar === 'adjective') {
            def = `Describing something that is associated with or characterized by ${word} (generated offline).`;
            ex = `The researcher provided a ${word} response to the interview panel.`;
            def2 = `Tending to produce, promote, or facilitate aspects associated with ${word} in formal analyses.`;
            ex2 = `They adopted a ${word} methodology for the economic research project.`;
          } else {
            def = `In a manner associated with being ${word.replace('ly', '')} (generated offline).`;
            ex = `She argued ${word} during the academic seminar.`;
            def2 = `From a perspective concerning ${word.replace('ly', '')} properties or theoretical principles.`;
            ex2 = `The results were evaluated ${word} across all experimental groups.`;
          }
        } else {
          def = `An offline-generated description for the ${type} "${word}". Click edit to input the correct Cambridge definition.`;
          ex = `This example shows how to use "${word}" in an IELTS context.`;
          def2 = `A secondary figurative or contextual sense for the ${type} "${word}". Click edit to refine definitions.`;
          ex2 = `We must practice using "${word}" in writing and speaking modules.`;
        }

        const cleanWord = word.replace('something', '').replace('someone', '').trim();
        const mockIpa = `/${cleanWord.replace(/c/g, 'k').replace(/y/g, 'aɪ')}/`;

        const wf = type === 'word' ? generateWordFamily(word, grammar) : null;
        const extraEx = generateExtraExamples(word, grammar);

        return {
          word: word,
          entry_type: type,
          ipa_uk: mockIpa,
          ipa_us: mockIpa,
          definition: def,
          definition_source: 'cambridge',
          example: ex,
          definitions: [
            {
              definition: def,
              example: ex,
              cefr_level: cefr,
              grammar_note: grammar
            },
            {
              definition: def2,
              example: ex2,
              cefr_level: cefr === 'C1' ? 'C2' : 'C1',
              grammar_note: grammar
            }
          ],
          extra_examples: extraEx,
          grammar_note: grammar,
          base_verb: type === 'phrasal_verb' ? word.split(' ')[0] : '',
          particles: type === 'phrasal_verb' ? word.split(' ').slice(1).join(' ') : '',
          conjugations: type === 'phrasal_verb' ? { present_participle: `${word.split(' ')[0]}ing`, past_tense: `${word.split(' ')[0]}ed`, past_participle: `${word.split(' ')[0]}ed` } : null,
          related_phrasal_verbs: [],
          cefr_level: cefr,
          register: reg,
          formality_score: formality,
          connotation: connotation,
          word_family: wf,
          semantic_field_id: semId,
          semantic_field_label: semLabel,
          semantic_field_words: [],
          register_synonyms: [],
          suggested_folder_name: folderName
        };
      };

      // Add word to vault database
      const handleSaveEntry = () => {
        if (!lookupResults) return;

        const defs = customDefinitions.length > 0 ? customDefinitions : [
          {
            definition: customDefinition,
            example: customExample,
            cefr_level: customCefr,
            grammar_note: customGrammar
          }
        ];

        const newEntry = {
          ...lookupResults,
          id: `entry-${Date.now()}`,
          definitions: defs,
          definition: defs[0].definition,
          example: defs[0].example,
          cefr_level: defs[0].cefr_level,
          grammar_note: defs[0].grammar_note,
          register: customRegister,
          connotation: customConnotation,
          formality_score: parseInt(customFormality),
          entry_type: customType,
          folder_ids: [...assignedFolderIds],
          word_family: customType === 'word' ? {
            verb: customFamilyVerb.split(',').map(s => s.trim()).filter(Boolean),
            noun: customFamilyNoun.split(',').map(s => s.trim()).filter(Boolean),
            adjective: customFamilyAdjective.split(',').map(s => s.trim()).filter(Boolean),
            adverb: customFamilyAdverb.split(',').map(s => s.trim()).filter(Boolean)
          } : null,
          review: {
            interval_days: 1,
            ease_factor: 2.5,
            due_date: new Date().toISOString().split('T')[0],
            repetition_count: 0,
            last_result: null
          },
          date_added: new Date().toISOString(),
          source_context: 'Added via offline lookup.'
        };

        if (suggestedFolder && !folders.some(f => f.name.toLowerCase() === suggestedFolder.toLowerCase())) {
          const autoCreateFolder = confirm(`Would you like to automatically create the folder "${suggestedFolder}" for this word?`);
          if (autoCreateFolder) {
            const newFolderId = `folder-${Date.now()}`;
            const newFolderObj = {
              id: newFolderId,
              name: suggestedFolder,
              color: ['#FAEDCB', '#C9E4DE', '#C6DEF1', '#DBCDF0', '#F2C6DE', '#F7D9C4'][Math.floor(Math.random() * 6)],
              created_at: new Date().toISOString(),
              word_count: 1
            };
            setFolders(prev => [...prev, newFolderObj]);
            newEntry.folder_ids.push(newFolderId);
          }
        }

        // Open word family verification modal instead of saving immediately!
        const hasWordFamily = newEntry.word_family && (
          newEntry.word_family.verb.length > 0 ||
          newEntry.word_family.noun.length > 0 ||
          newEntry.word_family.adjective.length > 0 ||
          newEntry.word_family.adverb.length > 0
        );

        if (newEntry.entry_type === 'word' && hasWordFamily) {
          setWordFamilyVerifyData(newEntry);
        } else {
          setEntries(prev => [newEntry, ...prev]);
          showToastGlobal(`"${newEntry.word}" has been saved to the vault!`);
          setIsAddModalOpen(false);
          setLookupWord('');
          setLookupResults(null);
        }
      };

      // Handler for verifying word family on user input
      const handleConfirmWordFamilySave = (includeFamily) => {
        if (!wordFamilyVerifyData) return;
        const finalEntry = { ...wordFamilyVerifyData };
        if (!includeFamily) {
          finalEntry.word_family = {
            verb: [],
            noun: [],
            adjective: [],
            adverb: []
          };
        }
        setEntries(prev => [finalEntry, ...prev]);
        showToastGlobal(`"${finalEntry.word}" has been saved to the vault!`);
        setWordFamilyVerifyData(null);
        setIsAddModalOpen(false);
        setLookupWord('');
        setLookupResults(null);
      };

      // Handler for code-imported words verification on app launch
      const handleConfirmImports = () => {
        const processed = pendingImports.map(item => {
          const { includeWordFamily, ...entry } = item;
          if (!includeWordFamily) {
            entry.word_family = {
              verb: [],
              noun: [],
              adjective: [],
              adverb: []
            };
          }
          return entry;
        });

        // Merge into state
        setEntries(prev => [...prev, ...processed]);
        
        // Also auto-merge folders if there are folders that were missed
        const savedFolders = localStorage.getItem('lexicon_folders');
        if (savedFolders) {
          try {
            const parsedFolders = JSON.parse(savedFolders);
            const existingFolderIds = new Set(parsedFolders.map(f => f.id));
            const missingFolders = INITIAL_FOLDERS.filter(f => !existingFolderIds.has(f.id));
            if (missingFolders.length > 0) {
              setFolders(prev => [...prev, ...missingFolders]);
            }
          } catch (e) {
            console.error("Failed to merge folders", e);
          }
        }

        // Clear the pending imports state
        setPendingImports([]);
        showToastGlobal(`Successfully imported ${processed.length} new entries!`);
      };

      // Edit Entry save
      const handleSaveEdit = (updatedObject) => {
        setEntries(prev => prev.map(item => {
          if (item.id === updatedObject.id) {
            return updatedObject;
          }
          return item;
        }));
        showToastGlobal(`"${updatedObject.word}" successfully updated!`);
        setIsEditModalOpen(false);
        setEditingEntry(null);
      };

      // Delete Entry from vault
      const handleDeleteEntry = (entryId, wordText) => {
        if (confirm(`Are you sure you want to permanently delete "${wordText}" from the vault?`)) {
          setEntries(prev => prev.filter(e => e.id !== entryId));
          showToastGlobal(`"${wordText}" deleted.`);
        }
      };

      // Open edit folder modal helper
      const openEditFolderModal = (folderObj) => {
        setEditingFolder(folderObj);
        setNewFolderName(folderObj.name);
        setNewFolderColor(folderObj.color);
        setNewFolderEmoji(folderObj.emoji || '🎓');
        setNewFolderDescription(folderObj.description || '');
        
        // Find all entries currently in this folder
        const selected = entries.filter(e => e.folder_ids.includes(folderObj.id)).map(e => e.id);
        setNewFolderSelectedWords(selected);
        setBulkSearchQuery('');
        
        setIsFolderModalOpen(true);
      };

      // Folder creation and editing
      const handleCreateFolder = () => {
        if (!newFolderName.trim()) return;

        if (editingFolder) {
          // Edit Mode
          const folderId = editingFolder.id;
          if (folders.some(f => f.id !== folderId && f.name.toLowerCase() === newFolderName.toLowerCase().trim())) {
            alert('A folder with that name already exists.');
            return;
          }

          setFolders(prev => prev.map(f => {
            if (f.id === folderId) {
              return {
                ...f,
                name: newFolderName.trim(),
                color: newFolderColor,
                emoji: newFolderEmoji,
                description: newFolderDescription.trim()
              };
            }
            return f;
          }));

          // Synchronize folder assignments
          setEntries(prev => prev.map(entry => {
            const hasFolder = entry.folder_ids.includes(folderId);
            const shouldHaveFolder = newFolderSelectedWords.includes(entry.id);
            if (shouldHaveFolder && !hasFolder) {
              return { ...entry, folder_ids: [...entry.folder_ids, folderId] };
            } else if (!shouldHaveFolder && hasFolder) {
              return { ...entry, folder_ids: entry.folder_ids.filter(id => id !== folderId) };
            }
            return entry;
          }));

          showToastGlobal(`Folder "${newFolderEmoji} ${newFolderName.trim()}" updated successfully.`);
        } else {
          // Create Mode
          if (folders.some(f => f.name.toLowerCase() === newFolderName.toLowerCase().trim())) {
            alert('A folder with that name already exists.');
            return;
          }

          const newFolderId = `folder-${Date.now()}`;
          const folderObj = {
            id: newFolderId,
            name: newFolderName.trim(),
            color: newFolderColor,
            emoji: newFolderEmoji,
            description: newFolderDescription.trim(),
            created_at: new Date().toISOString(),
            word_count: newFolderSelectedWords.length
          };

          if (newFolderSelectedWords.length > 0) {
            setEntries(prev => prev.map(entry => {
              if (newFolderSelectedWords.includes(entry.id)) {
                const updatedFolders = entry.folder_ids.includes(newFolderId)
                  ? entry.folder_ids
                  : [...entry.folder_ids, newFolderId];
                return { ...entry, folder_ids: updatedFolders };
              }
              return entry;
            }));
          }

          setFolders(prev => [...prev, folderObj]);
          showToastGlobal(`Folder "${folderObj.emoji} ${folderObj.name}" created with ${newFolderSelectedWords.length} words assigned.`);
        }

        // Reset state
        setNewFolderName('');
        setNewFolderColor('#FAEDCB');
        setNewFolderEmoji('🎓');
        setNewFolderDescription('');
        setNewFolderSelectedWords([]);
        setBulkSearchQuery('');
        setEditingFolder(null);
        setIsFolderModalOpen(false);
      };

      // Delete Folder
      const handleDeleteFolder = (folderId, folderName) => {
        if (confirm(`Are you sure you want to delete the folder "${folderName}"? Word entries themselves will NOT be deleted.`)) {
          setFolders(prev => prev.filter(f => f.id !== folderId));
          
          setEntries(prev => prev.map(entry => {
            if (entry.folder_ids.includes(folderId)) {
              return {
                ...entry,
                folder_ids: entry.folder_ids.filter(id => id !== folderId)
              };
            }
            return entry;
          }));

          if (selectedFolderId === folderId) {
            setSelectedFolderId(null);
          }
          showToastGlobal(`Folder "${folderName}" deleted.`);
        }
      };

      // Filtered vocabulary list
      const filteredEntries = useMemo(() => {
        return entries.filter(entry => {
          if (selectedFolderId && !entry.folder_ids.includes(selectedFolderId)) {
            return false;
          }
          if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase().trim();
            const matchesWord = entry.word.toLowerCase().includes(query);
            const matchesDef = entry.definition.toLowerCase().includes(query);
            const matchesField = entry.semantic_field_label.toLowerCase().includes(query);
            if (!matchesWord && !matchesDef && !matchesField) return false;
          }
          if (filterCefr !== 'ALL' && entry.cefr_level !== filterCefr) {
            return false;
          }
          if (filterRegister !== 'ALL' && entry.register !== filterRegister) {
            return false;
          }
          if (filterType !== 'ALL' && entry.entry_type !== filterType) {
            return false;
          }
          return true;
        });
      }, [entries, selectedFolderId, searchQuery, filterCefr, filterRegister, filterType]);

      const navigateToWord = (wordText) => {
        const matched = entries.find(e => e.word.toLowerCase() === wordText.toLowerCase());
        if (matched) {
          setSelectedFolderId(null);
          setFilterCefr('ALL');
          setFilterRegister('ALL');
          setFilterType('ALL');
          setSearchQuery(wordText);
          showToastGlobal(`Viewing matching card for "${wordText}".`);
        } else {
          setLookupWord(wordText);
          setIsAddModalOpen(true);
          setTimeout(() => {
            handleAILookup();
          }, 200);
        }
      };

      return (
        <div style={{ display: 'flex', width: '100%', height: '100%' }}>
          {/* Toast Notification HUD */}
          <div className="toast-container">
            {toasts.map(toast => (
              <div key={toast.id} className="toast">
                <Icon name="info" style={{ color: 'white', marginRight: '6px' }} />
                <span>{toast.message}</span>
              </div>
            ))}
          </div>

          {/* LEFT SIDEBAR NAVIGATION */}
          <aside className="sidebar">
            <div className="sidebar-header">
              <h1 className="sidebar-title">
                <Icon name="bookOpen" style={{ marginRight: '6px' }} /> Lexicon Vault
              </h1>
            </div>

            {/* STUDY TIME TRACKER WIDGET */}
            <div className="study-timer-widget" style={{
              margin: '16px 16px 8px 16px',
              padding: '12px',
              borderRadius: '8px',
              border: '2px solid var(--border-strong)',
              backgroundColor: isTimerRunning ? 'rgba(16, 185, 129, 0.08)' : 'var(--bg-app)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              transition: 'all 0.3s ease',
              boxShadow: isTimerRunning ? '0 0 10px rgba(16, 185, 129, 0.15)' : 'none'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span 
                  className={isTimerRunning ? 'timer-pulse' : ''} 
                  style={{ 
                    fontSize: '18px',
                    display: 'inline-block'
                  }}
                >
                  ⏱️
                </span>
                <div style={{ display: 'flex', flexDirection: 'column', textAlign: 'left' }}>
                  <span style={{ fontSize: '10px', textTransform: 'uppercase', fontWeight: '700', color: 'var(--text-muted)' }}>
                    {isTimerRunning ? 'Actively Studying' : 'Study Time Today'}
                  </span>
                  <span style={{ fontSize: '15px', fontWeight: '800', color: 'var(--text-main)', fontFamily: 'monospace' }}>
                    {formatStudyTime(studyTimeToday)}
                  </span>
                </div>
              </div>
              <span 
                style={{
                  width: '8px',
                  height: '8px',
                  borderRadius: '50%',
                  backgroundColor: isTimerRunning ? '#10B981' : '#64748B',
                  boxShadow: isTimerRunning ? '0 0 8px #10B981' : 'none',
                  transition: 'background-color 0.3s'
                }}
              />
            </div>

            <nav className="sidebar-nav">
              <button 
                className={`nav-item ${activeTab === 'vault' ? 'active' : ''}`}
                onClick={() => { setActiveTab('vault'); setSelectedFolderId(null); }}
              >
                <span className="nav-icon-text">
                  <Icon name="archive" style={{ marginRight: '6px' }} /> All Vocabulary
                </span>
                <span style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{entries.length}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'review' ? 'active' : ''}`}
                onClick={() => { setActiveTab('review'); setIsReviewSessionStarted(false); }}
              >
                <span className="nav-icon-text">
                  <Icon name="brain" style={{ marginRight: '6px' }} /> Spaced Repetition
                </span>
                {dueCount > 0 && <span className="due-badge">{dueCount}</span>}
              </button>

              <button 
                className={`nav-item ${activeTab === 'graph' ? 'active' : ''}`}
                onClick={() => setActiveTab('graph')}
              >
                <span className="nav-icon-text">
                  <Icon name="network" style={{ marginRight: '6px' }} /> Semantic Network
                </span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'practice' ? 'active' : ''}`}
                onClick={() => setActiveTab('practice')}
              >
                <span className="nav-icon-text">
                  <Icon name="puzzle" style={{ marginRight: '6px' }} /> Practice Phrasal Verbs
                </span>
              </button>


              <button 
                className={`nav-item ${activeTab === 'analyzer' ? 'active' : ''}`}
                onClick={() => setActiveTab('analyzer')}
              >
                <span className="nav-icon-text">
                  <Icon name="newspaper" style={{ marginRight: '6px' }} /> Article Analyzer
                </span>
              </button>
            </nav>

            <div className="sidebar-section">
              <h2 className="section-title">
                Folders
                <button className="add-folder-btn" onClick={() => setIsFolderModalOpen(true)}>
                  <Icon name="plus" />
                </button>
              </h2>

              <div className="folder-list">
                {updatedFolders.map(folder => (
                  <div 
                    key={folder.id} 
                    className={`folder-item ${selectedFolderId === folder.id && activeTab === 'vault' ? 'active' : ''}`}
                    onClick={() => { setSelectedFolderId(folder.id); setActiveTab('vault'); }}
                  >
                    <div style={{ display: 'flex', alignItems: 'center' }}>
                      <span className="folder-color-dot" style={{ backgroundColor: folder.color }}></span>
                      <span style={{ textDecoration: selectedFolderId === folder.id ? 'underline' : 'none' }}>
                        {folder.emoji ? `${folder.emoji} ` : ''}{folder.name}
                      </span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span style={{ fontSize: '11px', color: 'var(--text-muted)' }}>({folder.word_count})</span>
                      <div className="folder-actions">
                        <button 
                          className="folder-action-btn"
                          onClick={(e) => { e.stopPropagation(); openEditFolderModal(folder); }}
                          title="Edit Folder"
                        >
                          <Icon name="edit" style={{ width: '0.9em', height: '0.9em' }} />
                        </button>
                        <button 
                          className="folder-action-btn"
                          onClick={(e) => { e.stopPropagation(); handleDeleteFolder(folder.id, folder.name); }}
                          title="Delete Folder"
                        >
                          <Icon name="trash" style={{ width: '0.9em', height: '0.9em' }} />
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </aside>

          {/* MAIN VIEWPORT */}
          <main className="main-content">
            
            {/* TOP BAR / NAVIGATION ACTION ELEMENTS */}
            {activeTab !== 'analyzer' && (
              <header className="top-nav">
                <div className="search-box-container">
                  <Icon name="search" className="search-icon" />
                  <input 
                    type="text" 
                    className="search-input" 
                    placeholder="Search vault word or definition..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                  {searchQuery && (
                    <span style={{ cursor: 'pointer' }} onClick={() => setSearchQuery('')}>
                      <Icon name="times" style={{ color: 'var(--text-muted)', width: '0.9em' }} />
                    </span>
                  )}
                </div>

                <div className="top-nav-actions">
                  {activeTab === 'vault' && selectedFolderId && (
                    <span className="badge" style={{ backgroundColor: folders.find(f => f.id === selectedFolderId)?.color, border: '1px solid var(--border-strong)' }}>
                      Active Folder: {folders.find(f => f.id === selectedFolderId)?.name}
                    </span>
                  )}
                  <button className="btn btn-primary" onClick={() => { setLookupResults(null); setIsAddModalOpen(true); }}>
                    <Icon name="plus" /> Add Entry
                  </button>
                </div>
              </header>
            )}

            {/* VAULT VIEW TAB */}
            {activeTab === 'vault' && (
              <div style={{ display: 'flex', flexDirection: 'column', flexGrow: 1, overflow: 'hidden' }}>
                {/* FILTER HUD */}
                <div className="filter-bar">
                  <div className="filter-group">
                    <span className="filter-label">CEFR:</span>
                    <select className="filter-select" value={filterCefr} onChange={(e) => setFilterCefr(e.target.value)}>
                      <option value="ALL">All Levels</option>
                      <option value="B1">B1 (Threshold)</option>
                      <option value="B2">B2 (Vantage)</option>
                      <option value="C1">C1 (Advanced)</option>
                      <option value="C2">C2 (Mastery)</option>
                    </select>
                  </div>

                  <div className="filter-group">
                    <span className="filter-label">Register:</span>
                    <select className="filter-select" value={filterRegister} onChange={(e) => setFilterRegister(e.target.value)}>
                      <option value="ALL">All Registers</option>
                      <option value="neutral">Neutral</option>
                      <option value="formal">Formal</option>
                      <option value="academic">Academic</option>
                      <option value="informal">Informal</option>
                      <option value="business">Business</option>
                      <option value="journalism">Journalism</option>
                      <option value="legal">Legal</option>
                      <option value="literary">Literary</option>
                    </select>
                  </div>

                  <div className="filter-group">
                    <span className="filter-label">Type:</span>
                    <select className="filter-select" value={filterType} onChange={(e) => setFilterType(e.target.value)}>
                      <option value="ALL">All Types</option>
                      <option value="word">Words Only</option>

                                  return e.review.due_date === dateStr;
                                }

    function WordCard({ entry, folders, speakWord, speechActiveWord, navigateToWord, onEdit, onDelete, vaultEntries }) {
      const [showAllExamples, setShowAllExamples] = useState(false);

      const checkWordInVault = (wordName) => {
        return vaultEntries.some(e => e.word.toLowerCase() === wordName.toLowerCase());
      };

    const getFamilyWords = (entry) => {
      const words = new Set();
      words.add(entry.word.toLowerCase().trim());
      if (entry.word_family) {
        ['noun', 'verb', 'adjective', 'adverb'].forEach(pos => {
          const list = entry.word_family[pos];
          if (Array.isArray(list)) {
            list.forEach(w => words.add(w.toLowerCase().trim()));
          }
        });
      }
      return words;
    };

    // Helper to group entries into word families based on overlapping family words
    const groupEntriesByFamily = (entriesList) => {
      const groups = []; // Array of { representative: string, entries: Entry[] }
      
      entriesList.forEach(entry => {
        const entryFamily = getFamilyWords(entry);
        
        let targetGroup = null;
        for (const group of groups) {
          const sharesConnection = group.entries.some(ge => {
            const geFamily = getFamilyWords(ge);
            for (const w of entryFamily) {
              if (geFamily.has(w)) return true;
            }
            return false;
          });
          
          if (sharesConnection) {
            targetGroup = group;
            break;
          }
        }
        
        if (targetGroup) {
          targetGroup.entries.push(entry);
        } else {
          groups.push({
            representative: entry.word,
            entries: [entry]
          });
        }
      });
      
      groups.forEach(g => {
        g.entries.sort((a, b) => a.word.localeCompare(b.word));
        g.representative = g.entries[0].word;
      });
      
      groups.sort((a, b) => a.representative.localeCompare(b.representative));
      return groups;
    };
