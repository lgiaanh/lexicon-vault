    // ----------------------------------------------------
    // INTERACTIVE D3.JS NETWORK GRAPH VIEW
    // ----------------------------------------------------
    function GraphView({ entries, folders, speakWord, speechActiveWord, navigateToWord, onEdit, onDelete }) {
      const d3Container = useRef(null);
      const [selectedWord, setSelectedWord] = useState(null);
      const [graphFolderId, setGraphFolderId] = useState('ALL');
      const [graphCefr, setGraphCefr] = useState('ALL');
      const [graphRegister, setGraphRegister] = useState('ALL');
      const [showLinkLabels, setShowLinkLabels] = useState(true);

      // Graph Search & Viewport Centering State & Refs
      const [graphSearchQuery, setGraphSearchQuery] = useState('');
      const svgRef = useRef(null);
      const zoomRef = useRef(null);
      const nodePositionsRef = useRef(new Map());

      const filteredNodesData = useMemo(() => {
        return entries.filter(entry => {
          if (graphFolderId !== 'ALL' && !entry.folder_ids.includes(graphFolderId)) return false;
          if (graphCefr !== 'ALL' && entry.cefr_level !== graphCefr) return false;
          if (graphRegister !== 'ALL' && entry.register !== graphRegister) return false;
          return true;
        });
      }, [entries, graphFolderId, graphCefr, graphRegister]);

      const activeWordObj = useMemo(() => {
        if (!selectedWord) return null;
        return entries.find(e => e.word.toLowerCase() === selectedWord.toLowerCase());
      }, [selectedWord, entries]);

      // Autocomplete Search Suggestions
      const searchSuggestions = useMemo(() => {
        if (!graphSearchQuery.trim()) return [];
        const q = graphSearchQuery.toLowerCase().trim();
        return entries
          .filter(e => e.word.toLowerCase().includes(q))
          .slice(0, 5); // limit to 5 suggestions
      }, [entries, graphSearchQuery]);

      // Center viewport on node
      const centerNode = (wordText) => {
        if (!d3Container.current || !svgRef.current || !zoomRef.current) return;
        const pos = nodePositionsRef.current.get(wordText.toLowerCase());
        if (!pos) return;

        const width = d3Container.current.clientWidth;
        const height = d3Container.current.clientHeight;

        d3.select(svgRef.current.node())
          .transition()
          .duration(750)
          .call(
            zoomRef.current.transform,
            d3.zoomIdentity.translate(width / 2 - 1.3 * pos.x, height / 2 - 1.3 * pos.y).scale(1.3)
          );
      };

      // Effect to smoothly center view when a word is selected
      useEffect(() => {
        if (selectedWord) {
          const timer = setTimeout(() => {
            centerNode(selectedWord);
          }, 150);
          return () => clearTimeout(timer);
        }
      }, [selectedWord, filteredNodesData]);

      // Handle search find node
      const handleFindWord = (wordText) => {
        const term = wordText.toLowerCase().trim();
        if (!term) return;

        const entry = entries.find(e => e.word.toLowerCase() === term);
        if (!entry) return;

        const inCurrentGraph = filteredNodesData.some(n => n.word.toLowerCase() === term);
        if (!inCurrentGraph) {
          // Auto reset filters to reveal
          setGraphFolderId('ALL');
          setGraphCefr('ALL');
          setGraphRegister('ALL');
        }
        
        setSelectedWord(entry.word);
        setGraphSearchQuery('');
      };

      useEffect(() => {
        if (!d3Container.current) return;

        d3.select(d3Container.current).selectAll('*').remove();

        if (filteredNodesData.length === 0) return;

        const width = d3Container.current.clientWidth;
        const height = d3Container.current.clientHeight;

        const svg = d3.select(d3Container.current)
          .append('svg')
          .attr('width', '100%')
          .attr('height', '100%')
          .attr('viewBox', [0, 0, width, height]);

        const g = svg.append('g');

        const zoomObj = d3.zoom()
          .extent([[0, 0], [width, height]])
          .scaleExtent([0.3, 4])
          .on('zoom', ({ transform }) => {
            g.attr('transform', transform);
          });

        svg.call(zoomObj);

        // Store references for programmatically panning/zooming
        svgRef.current = svg;
        zoomRef.current = zoomObj;

        const nodes = filteredNodesData.map(d => ({
          id: d.word,
          word: d.word,
          cefr: d.cefr_level,
          register: d.register,
          semantic_field_id: d.semantic_field_id,
          register_synonyms: d.register_synonyms || []
        }));

        const links = [];
        const nodeMap = new Map(nodes.map(n => [n.id.toLowerCase(), n]));

        for (let i = 0; i < nodes.length; i++) {
          const sourceNode = nodes[i];
          const sourceEntry = entries.find(e => e.word.toLowerCase() === sourceNode.id.toLowerCase());
          if (!sourceEntry) continue;

          for (let j = i + 1; j < nodes.length; j++) {
            const targetNode = nodes[j];
            if (sourceNode.semantic_field_id && sourceNode.semantic_field_id === targetNode.semantic_field_id) {
              links.push({
                source: sourceNode.id,
                target: targetNode.id,
                type: 'solid',
                relation: sourceEntry.semantic_field_label || 'Same Theme'
              });
            }
          }

          if (sourceEntry.register_synonyms) {
            sourceEntry.register_synonyms.forEach(syn => {
              const matchingTarget = nodeMap.get(syn.word.toLowerCase());
              if (matchingTarget) {
                const alreadyExists = links.some(l => 
                  (l.source === sourceNode.id && l.target === matchingTarget.id) ||
                  (l.source === matchingTarget.id && l.target === sourceNode.id)
                );
                if (!alreadyExists) {
                  links.push({
                    source: sourceNode.id,
                    target: matchingTarget.id,
                    type: 'dashed',
                    relation: syn.register ? `Synonym (${syn.register})` : 'Synonym'
                  });
                }
              }
            });
          }
        }

        const degreeMap = {};
        nodes.forEach(n => { degreeMap[n.id] = 0; });
        links.forEach(l => {
          degreeMap[l.source] = (degreeMap[l.source] || 0) + 1;
          degreeMap[l.target] = (degreeMap[l.target] || 0) + 1;
        });

        const simulation = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(d => d.id).distance(120))
          .force('charge', d3.forceManyBody().strength(-200))
          .force('center', d3.forceCenter(width / 2, height / 2))
          .force('collision', d3.forceCollide().radius(d => Math.max(15, (degreeMap[d.id] || 0) * 3 + 12) + 5));

        const link = g.append('g')
          .attr('class', 'links')
          .selectAll('line')
          .data(links)
          .enter()
          .append('line')
          .attr('class', d => `link-line ${d.type}`);

        // Draw relationship text labels along link lines
        const linkText = g.append('g')
          .attr('class', 'link-labels')
          .selectAll('text')
          .data(links)
          .enter()
          .append('text')
          .attr('font-size', '7px')
          .attr('font-weight', '500')
          .attr('fill', 'var(--text-muted, #64748B)')
          .attr('stroke', 'var(--bg-card, #ffffff)')
          .attr('stroke-width', '2px')
          .attr('paint-order', 'stroke fill')
          .attr('text-anchor', 'middle')
          .attr('dy', '2.5px')
          .style('opacity', showLinkLabels ? 0.75 : 0)
          .text(d => d.relation);

        const cefrColors = {
          'B1': '#FAEDCB',
          'B2': '#C6DEF1',
          'C1': '#DBCDF0',
          'C2': '#F2C6DE'
        };

        const tooltip = d3.select('#graph-view-tooltip');

        const drag = (simulation) => {
          function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
          }
          function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
          }
          function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
          }
          return d3.drag()
            .on('start', dragstarted)
            .on('drag', dragged)
            .on('end', dragended);
        };

        const node = g.append('g')
          .attr('class', 'nodes')
          .selectAll('g')
          .data(nodes)
          .enter()
          .append('g')
          .call(drag(simulation));

        node.append('circle')
          .attr('class', d => selectedWord === d.id ? 'node-halo pulse' : 'node-halo')
          .attr('r', d => Math.max(12, (degreeMap[d.id] || 0) * 2 + 10) + 4)
          .attr('fill', 'none')
          .style('stroke', 'var(--accent)')
          .style('stroke-width', d => selectedWord === d.id ? '1.5px' : '0px')
          .style('pointer-events', 'none');

        node.append('circle')
          .attr('class', 'node-circle')
          .attr('r', d => Math.max(12, (degreeMap[d.id] || 0) * 2 + 10))
          .attr('fill', d => cefrColors[d.cefr] || '#E7EBEE')
          .style('stroke', d => selectedWord === d.id ? 'var(--accent)' : '#1E293B')
          .style('stroke-width', d => selectedWord === d.id ? '2px' : '1.5px')
          .on('click', (event, d) => {
            event.stopPropagation();
            setSelectedWord(d.id);
          })
          .on('mouseover', (event, d) => {
            const matched = entries.find(e => e.word.toLowerCase() === d.word.toLowerCase());
            const def = matched ? matched.definition : '';
            tooltip.transition().duration(100).style('opacity', 0.95);
            tooltip.html(`<div class="graph-tooltip-title">${d.word} (${d.cefr})</div><div>${def}</div>`);
          })
          .on('mousemove', (event) => {
            const bounds = d3Container.current.getBoundingClientRect();
            tooltip
              .style('left', `${event.clientX - bounds.left + 15}px`)
              .style('top', `${event.clientY - bounds.top + 15}px`);
          })
          .on('mouseout', () => {
            tooltip.transition().duration(100).style('opacity', 0);
          });

        node.append('text')
          .attr('class', 'node-text')
          .attr('dy', '.3em')
          .text(d => d.word);

        simulation.on('tick', () => {
          link
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);

          linkText
            .attr('x', d => (d.source.x + d.target.x) / 2)
            .attr('y', d => (d.source.y + d.target.y) / 2);

          node
            .attr('transform', d => `translate(${d.x},${d.y})`);

          // Update real-time node coordinates in ref map
          nodes.forEach(n => {
            nodePositionsRef.current.set(n.id.toLowerCase(), { x: n.x, y: n.y });
          });
        });

        return () => {
          simulation.stop();
        };
      }, [filteredNodesData]);

      // Effect to update node highlight styles when selectedWord changes
      useEffect(() => {
        if (!d3Container.current) return;

        // Update halo classes and styles
        d3.select(d3Container.current)
          .selectAll('.node-halo')
          .attr('class', d => selectedWord === d.id ? 'node-halo pulse' : 'node-halo')
          .style('stroke-width', d => selectedWord === d.id ? '1.5px' : '0px');

        // Update node circle stroke and stroke-width
        d3.select(d3Container.current)
          .selectAll('.node-circle')
          .style('stroke', d => selectedWord === d.id ? 'var(--accent)' : '#1E293B')
          .style('stroke-width', d => selectedWord === d.id ? '2px' : '1.5px');
      }, [selectedWord, filteredNodesData]);

      // Effect to smoothly toggle labels visibility without restarting the D3 simulation
      useEffect(() => {
        if (!d3Container.current) return;
        d3.select(d3Container.current)
          .selectAll('.link-labels text')
          .transition()
          .duration(200)
          .style('opacity', showLinkLabels ? 0.75 : 0);
      }, [showLinkLabels]);

      return (
        <div className="graph-container">
          <div id="graph-view-tooltip" className="graph-tooltip"></div>

          <div ref={d3Container} className="graph-viewport">
            {filteredNodesData.length === 0 && (
              <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', textAlign: 'center' }}>
                <h3 className="empty-title">No vocabulary in graph</h3>
                <p className="empty-desc">Adjust filters in sidebar to show items.</p>
              </div>
            )}
          </div>

          <div className="graph-sidebar">
            <div className="graph-sidebar-header">
              <h3 className="graph-sidebar-title">Graph Explorer</h3>
            </div>

            <div className="graph-sidebar-content">
              <div className="form-group" style={{ position: 'relative' }}>
                <label className="form-label">Find Word in Network</label>
                <div style={{ display: 'flex', gap: '6px' }}>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder="Search word in network..." 
                    value={graphSearchQuery}
                    onChange={(e) => setGraphSearchQuery(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        const exactMatch = entries.find(n => n.word.toLowerCase() === graphSearchQuery.toLowerCase().trim());
                        if (exactMatch) {
                          handleFindWord(exactMatch.word);
                        }
                      }
                    }}
                  />
                </div>
                {searchSuggestions.length > 0 && (
                  <div className="graph-search-suggestions">
                    {searchSuggestions.map((node) => (
                      <div 
                        key={node.word} 
                        className="graph-search-suggestion-item"
                        onClick={() => handleFindWord(node.word)}
                      >
                        <strong>{node.word}</strong> <span style={{ fontSize: '10px', opacity: 0.75 }}>({node.cefr_level})</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="form-group">
                <label className="form-label">Folder Filter</label>
                <select className="form-select" value={graphFolderId} onChange={(e) => setGraphFolderId(e.target.value)}>
                  <option value="ALL">All Folders</option>
                  {folders.map(f => (
                    <option key={f.id} value={f.id}>{f.name}</option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label className="form-label">CEFR Filter</label>
                <select className="form-select" value={graphCefr} onChange={(e) => setGraphCefr(e.target.value)}>
                  <option value="ALL">All Levels</option>
                  <option value="B1">B1</option>
                  <option value="B2">B2</option>
                  <option value="C1">C1</option>
                  <option value="C2">C2</option>
                </select>
              </div>

              <div className="form-group">
                <label className="form-label">Register Filter</label>
                <select className="form-select" value={graphRegister} onChange={(e) => setGraphRegister(e.target.value)}>
                  <option value="ALL">All Registers</option>
                  <option value="neutral">neutral</option>
                  <option value="formal">formal</option>
                  <option value="academic">academic</option>
                  <option value="informal">informal</option>
                  <option value="business">business</option>
                  <option value="journalism">journalism</option>
                  <option value="legal">legal</option>
                  <option value="literary">literary</option>
                </select>
              </div>

              <div className="form-group" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', userSelect: 'none', marginTop: '10px', marginBottom: '16px' }}>
                <input 
                  type="checkbox" 
                  id="toggle-labels"
                  checked={showLinkLabels} 
                  onChange={(e) => setShowLinkLabels(e.target.checked)} 
                  style={{ cursor: 'pointer', width: '15px', height: '15px' }}
                />
                <label htmlFor="toggle-labels" className="form-label" style={{ margin: 0, cursor: 'pointer', fontWeight: '600', fontSize: '12px', color: 'var(--text-main)' }}>
                  Show Relation Labels
                </label>
              </div>

              <div className="graph-legend">
                <strong style={{ display: 'block', marginBottom: '4px' }}>Legend Guide:</strong>
                <div className="legend-item">
                  <span className="legend-color-box" style={{ backgroundColor: '#FAEDCB' }}></span>
                  <span>B1 Threshold (Yellow)</span>
                </div>
                <div className="legend-item">
                  <span className="legend-color-box" style={{ backgroundColor: '#C6DEF1' }}></span>
                  <span>B2 Vantage (Blue)</span>
                </div>
                <div className="legend-item">
                  <span className="legend-color-box" style={{ backgroundColor: '#DBCDF0' }}></span>
                  <span>C1 Advanced (Purple)</span>
                </div>
                <div className="legend-item">
                  <span className="legend-color-box" style={{ backgroundColor: '#F2C6DE' }}></span>
                  <span>C2 Mastery (Pink)</span>
                </div>
                <div className="legend-item">
                  <span className="legend-line solid"></span>
                  <span>Semantic Field Link (Solid Green)</span>
                </div>
                <div className="legend-item">
                  <span className="legend-line dashed"></span>
                  <span>Register Synonym Link (Dashed Slate)</span>
                </div>
              </div>

              <div className="graph-instructions">
                Drag nodes to pin; drag background to pan/zoom. Click node to review entry details.
              </div>

              {activeWordObj && (
                <div className="graph-side-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                    <h4 style={{ fontFamily: 'var(--font-serif)', fontSize: '18px', margin: 0 }}>{activeWordObj.word}</h4>
                    <button className="btn btn-secondary" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={() => navigateToWord(activeWordObj.word)}>
                      Maximize
                    </button>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', marginBottom: '8px' }}>
                    {(() => {
                      const defs = activeWordObj.definitions && activeWordObj.definitions.length > 0 ? activeWordObj.definitions : [
                        {
                          definition: activeWordObj.definition,
                          cefr_level: activeWordObj.cefr_level,
                          grammar_note: activeWordObj.grammar_note
                        }
                      ];

                      return defs.map((d, index) => (
                        <div key={index} style={{ fontSize: '12.5px', color: 'var(--text-muted)', borderLeft: '2px solid var(--border-muted)', paddingLeft: '6px' }}>
                          {defs.length > 1 ? `${index + 1}. ` : ''}
                          {d.grammar_note && <span style={{ fontStyle: 'italic', fontSize: '11px' }}>({d.grammar_note}) </span>}
                          {d.definition}
                        </div>
                      ));
                    })()}
                  </div>
                  <div style={{ display: 'flex', gap: '4px', flexWrap: 'wrap' }}>
                    <span className={`badge badge-cefr-${activeWordObj.cefr_level.toLowerCase()}`} style={{ fontSize: '9px', padding: '1px 4px' }}>
                      {activeWordObj.cefr_level}
                    </span>
                    <span className={`badge badge-reg-${activeWordObj.register}`} style={{ fontSize: '9px', padding: '1px 4px' }}>
                      {activeWordObj.register}
                    </span>
                    <span className="badge badge-formality" style={{ fontSize: '9px', padding: '1px 4px' }}>
                      F{activeWordObj.formality_score}/5
                    </span>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // PHRASAL VERBS PRACTICE COMPONENT
    // ----------------------------------------------------
    function PhrasalVerbsPractice({ entries, setEntries, folders, navigateToWord, setActiveTab }) {
      const [sessionQueue, setSessionQueue] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isChecked, setIsChecked] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [score, setScore] = useState(0);
      const [incorrectItems, setIncorrectItems] = useState([]);
      const [sessionCompleted, setSessionCompleted] = useState(false);

      const allPhrasalVerbs = useMemo(() => {
        let pvList = entries.filter(e => e.entry_type === 'phrasal_verb');
        if (pvList.length < 3) {
          const defaults = INITIAL_ENTRIES.filter(e => e.entry_type === 'phrasal_verb');
          const extDb = EXTENDED_DICTIONARY_DB.filter(e => e.entry_type === 'phrasal_verb');
          pvList = [...pvList, ...defaults, ...extDb];
          const seen = new Set();
          pvList = pvList.filter(e => {
            const w = e.word.toLowerCase();
            if (seen.has(w)) return false;
            seen.add(w);
            return true;
          });
        }
        return pvList;
      }, [entries]);

      const startNewSession = () => {
        if (allPhrasalVerbs.length === 0) {
          setSessionQueue([]);
          return;
        }
        const shuffled = [...allPhrasalVerbs].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, Math.min(10, shuffled.length));
        
        const queue = selected.map(entry => {
          const examples = [entry.example, ...(entry.extra_examples || [])].filter(Boolean);
          const randomExample = examples[Math.floor(Math.random() * examples.length)] || '';
          
          const { masked, answer, isSeparated, answerVerb, answerParticle } = makeGapSentence(
            randomExample,
            entry.word,
            entry.base_verb,
            entry.particles,
            entry.conjugations
          );
          
          const distractors = allPhrasalVerbs
            .filter(e => e.word.toLowerCase() !== entry.word.toLowerCase())
            .sort(() => 0.5 - Math.random())
            .slice(0, 3)
            .map(e => e.word);
            
          const options = [entry.word, ...distractors].sort(() => 0.5 - Math.random());
          
          return {
            entry,
            example: randomExample,
            masked,
            answer,
            isSeparated,
            answerVerb,
            answerParticle,
            options
          };
        });

        setSessionQueue(queue);
        setCurrentIndex(0);
        setSelectedOption(null);
        setIsChecked(false);
        setIsCorrect(false);
        setScore(0);
        setIncorrectItems([]);
        setSessionCompleted(false);
      };

      useEffect(() => {
        startNewSession();
      }, []);

      const handleCheckAnswer = () => {
        if (isChecked || selectedOption === null) return;
        const currentQuestion = sessionQueue[currentIndex];
        const correct = selectedOption.toLowerCase() === currentQuestion.entry.word.toLowerCase();
        setIsCorrect(correct);
        setIsChecked(true);
        if (correct) {
          setScore(prev => prev + 1);
        } else {
          setIncorrectItems(prev => [...prev, currentQuestion.entry]);
        }

        // Record statistics
        if (setEntries) {
          setEntries(prev => prev.map(item => {
            if (item.id === currentQuestion.entry.id) {
              const stats = item.stats || { encounters: 0, correct: 0, incorrect: 0 };
              return {
                ...item,
                stats: {
                  encounters: stats.encounters + 1,
                  correct: stats.correct + (correct ? 1 : 0),
                  incorrect: stats.incorrect + (correct ? 0 : 1)
                }
              };
            }
            return item;
          }));
        }
      };

      const handleContinue = () => {
        if (currentIndex + 1 < sessionQueue.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsChecked(false);
          setIsCorrect(false);
        } else {
          setSessionCompleted(true);
        }
      };

      useEffect(() => {
        const handleKeyDown = (event) => {
          if (sessionCompleted || sessionQueue.length === 0) return;
          const currentQuestion = sessionQueue[currentIndex];
          if (!currentQuestion) return;

          if (event.key === 'Enter') {
            if (selectedOption !== null) {
              if (!isChecked) {
                handleCheckAnswer();
              } else {
                handleContinue();
              }
            }
          } else if (!isChecked && ['1', '2', '3', '4'].includes(event.key)) {
            const optIndex = parseInt(event.key) - 1;
            if (currentQuestion.options[optIndex]) {
              setSelectedOption(currentQuestion.options[optIndex]);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [sessionQueue, currentIndex, selectedOption, isChecked, sessionCompleted]);

      const renderSentence = (question, showAnswer) => {
        if (!question) return '';
        const parts = question.masked.split(/(\[____\]|\[________\])/);
        if (!showAnswer) {
          return parts.map((part, index) => {
            if (part === '[____]' || part === '[________]') {
              return <span key={index} className="practice-sentence-gap">______</span>;
            }
            return part;
          });
        } else {
          if (question.isSeparated) {
            let verbFilled = false;
            return parts.map((part, index) => {
              if (part === '[____]' && !verbFilled) {
                verbFilled = true;
                return (
                  <span key={index} className="practice-sentence-gap" style={{ borderBottom: 'none', color: isCorrect ? '#10B981' : '#F43F5E' }}>
                    {question.answerVerb}
                  </span>
                );
              }
              if (part === '[________]' || (part === '[____]' && verbFilled)) {
                return (
                  <span key={index} className="practice-sentence-gap" style={{ borderBottom: 'none', color: isCorrect ? '#10B981' : '#F43F5E' }}>
                    {question.answerParticle}
                  </span>
                );
              }
              return part;
            });
          } else {
            return parts.map((part, index) => {
              if (part === '[____]' || part === '[________]') {
                return (
                  <span key={index} className="practice-sentence-gap" style={{ borderBottom: 'none', color: isCorrect ? '#10B981' : '#F43F5E' }}>
                    {question.answer}
                  </span>
                );
              }
              return part;
            });
          }
        }
      };

      if (sessionQueue.length === 0) {
        return (
          <div className="practice-container">
            <div className="practice-card" style={{ textAlign: 'center', padding: '48px' }}>
              <Icon name="puzzle" style={{ fontSize: '48px', color: 'var(--text-muted)', marginBottom: '16px' }} />
              <h3 className="empty-title">Loading phrasal verbs...</h3>
            </div>
          </div>
        );
      }

      const currentQuestion = sessionQueue[currentIndex];
      const progressPercent = ((currentIndex + (isChecked ? 1 : 0)) / sessionQueue.length) * 100;

      return (
        <div className="practice-container">
          <div className="review-progress-header">
            <span>Phrasal Verbs Quiz</span>
            <div className="progress-track">
              <div 
                className="progress-bar" 
                style={{ width: `${progressPercent}%` }}
              ></div>
            </div>
            <span>{sessionCompleted ? sessionQueue.length : currentIndex + 1} of {sessionQueue.length}</span>
          </div>

          {!sessionCompleted ? (
            <div className="practice-card">
              <div className="practice-title-row">
                <span className="practice-title-icon">🧩</span>
                <span className="practice-title-text">Phrasal Verbs Practice</span>
              </div>

              <div className="practice-prompt-label">Complete the sentence:</div>
              <div className="practice-sentence">
                {renderSentence(currentQuestion, isChecked)}
              </div>

              <div className="practice-definition-box">
                <div className="practice-definition-label">Meaning / Clue:</div>
                <div>{currentQuestion.entry.definition}</div>
              </div>

              <div className="practice-options-grid">
                {currentQuestion.options.map((option, index) => {
                  const isSelected = selectedOption === option;
                  const isCorrectOption = option.toLowerCase() === currentQuestion.entry.word.toLowerCase();
                  
                  let btnClass = 'practice-option-btn';
                  if (isSelected) btnClass += ' selected';
                  if (isChecked) {
                    if (isCorrectOption) {
                      btnClass += ' correct-answer';
                    } else if (isSelected) {
                      btnClass += ' incorrect-answer';
                    }
                  }
                  
                  return (
                    <button 
                      key={index}
                      className={btnClass}
                      onClick={() => !isChecked && setSelectedOption(option)}
                      disabled={isChecked}
                    >

              {!isChecked ? (

                <div className={`practice-feedback-bar ${isCorrect ? 'correct' : 'incorrect'}`}>
                  <div className="practice-feedback-info">
                    <span className={`practice-feedback-icon ${isCorrect ? 'correct' : 'incorrect'}`} style={{ fontWeight: 'bold' }}>
                      {isCorrect ? '✓' : '✗'}
                    </span>
                    <div className="practice-feedback-text">
                      <span className={`practice-feedback-title ${isCorrect ? 'correct' : 'incorrect'}`}>
                        {isCorrect ? 'Correct!' : 'Incorrect'}
                      </span>
                      <span className="practice-feedback-desc">
                        {isCorrect 
                          ? 'Excellent work!' 
                          : `Correct answer: ${currentQuestion.entry.word}`
                        }
                      </span>
                    </div>
                  </div>
                  <button className="btn btn-primary" onClick={handleContinue}>
                    Continue
                  </button>
                </div>
              )}
            </div>
          ) : (
            <div className="practice-card">
              <div className="practice-title-row" style={{ justifyContent: 'center', flexDirection: 'column', gap: '8px' }}>
                <span style={{ fontSize: '48px' }}>🎉</span>
                <span className="practice-title-text" style={{ fontSize: '28px' }}>Session Completed!</span>
                <p style={{ color: 'var(--text-muted)', fontSize: '14px', margin: 0 }}>You completed your daily phrasal verb training.</p>
              </div>

              <div className="practice-summary-score-box">
                <div className="practice-summary-stat">
                  <span className="practice-summary-val">{score * 10}</span>
                  <span className="practice-summary-label">XP Gained</span>
                </div>
                <div className="practice-summary-stat" style={{ borderLeft: '1px solid var(--border-muted)', paddingLeft: '24px' }}>
                  <span className="practice-summary-val">{Math.round((score / sessionQueue.length) * 100)}%</span>
                  <span className="practice-summary-label">Accuracy</span>
                </div>
                <div className="practice-summary-stat" style={{ borderLeft: '1px solid var(--border-muted)', paddingLeft: '24px' }}>
                  <span className="practice-summary-val">{score}/{sessionQueue.length}</span>
                  <span className="practice-summary-label">Score</span>
                </div>
              </div>

              {incorrectItems.length > 0 && (
                <div style={{ marginTop: '10px' }}>
                  <h4 style={{ fontSize: '15px', fontWeight: '700', marginBottom: '8px' }}>Phrasal Verbs to Review:</h4>
                  <div className="practice-review-list">
                    {incorrectItems.map((item, index) => (
                      <div key={index} className="practice-review-item">
                        <div>
                          <div className="practice-review-word">{item.word}</div>
                          <div className="practice-review-def">{item.definition}</div>
                        </div>
                        <button 
                          className="btn btn-secondary" 
                          style={{ padding: '6px 12px', fontSize: '12px' }}
                          onClick={() => {
                            setActiveTab('vault');
                            navigateToWord(item.word);
                          }}
                        >
                          View in Vault
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', marginTop: '16px' }}>
                <button className="btn btn-secondary" onClick={() => setActiveTab('vault')}>
                  Go to Vault
                </button>
                <button className="btn btn-primary" onClick={startNewSession}>
                  Practice Again
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================================================
    // ARTICLE ANALYZER COMPONENT & UTILITIES
    // ==========================================================================

    // Helper utilities for morphological root word matching
    function stemWord(word) {
      if (!word) return [];
      const w = word.toLowerCase();
      const candidates = [w];
      
      // Plural s-inflections and possessives
      if (w.endsWith("'s")) {
        candidates.push(w.slice(0, -2));
      }
      if (w.endsWith("s")) {
        candidates.push(w.slice(0, -1)); // plurals
        if (w.endsWith("es")) {
          candidates.push(w.slice(0, -2));
        }
        if (w.endsWith("ies")) {
          candidates.push(w.slice(0, -3) + "y"); // studies -> study
        }
      }
      
      // Past tense / past participle
      if (w.endsWith("ed")) {
        candidates.push(w.slice(0, -1)); // loved -> love
        candidates.push(w.slice(0, -2)); // walked -> walk
        if (w.endsWith("ied")) {
          candidates.push(w.slice(0, -3) + "y"); // studied -> study
        }
        // Double consonant simplification: planned -> plan
        if (w.length > 4 && w[w.length - 3] === w[w.length - 4]) {
          candidates.push(w.slice(0, -3));
        }
      }
      
      // Present participle
      if (w.endsWith("ing")) {
        candidates.push(w.slice(0, -3)); // playing -> play
        candidates.push(w.slice(0, -3) + "e"); // writing -> write
        // Double consonant simplification: planning -> plan
        if (w.length > 5 && w[w.length - 4] === w[w.length - 5]) {
          candidates.push(w.slice(0, -4));
        }
      }
      
      // Adverbs
      if (w.endsWith("ly")) {
        candidates.push(w.slice(0, -2)); // slowly -> slow
      }
      
      return candidates;
    }

    function findDictMatch(word, vaultEntries, dictDb) {
      if (!word || word.trim() === "" || /^[0-9]+$/.test(word)) return null;
      const candidates = stemWord(word);
      
      // Check user vault entries first
      for (const cand of candidates) {
        const vaultMatch = vaultEntries.find(e => e.word.toLowerCase() === cand);
        if (vaultMatch) {
          return { entry: vaultMatch, isSaved: true };
        }
      }
      
      // Check extended dictionary database
      for (const cand of candidates) {
        const dictMatch = dictDb.find(e => e.word.toLowerCase() === cand);
        if (dictMatch) {
          return { entry: dictMatch, isSaved: false };
        }
      }
      
      return null;
    }

    function getArticleStats(content, vaultEntries, dictDb) {
      if (!content) return { b2: 0, c1: 0, c2: 0, total: 0 };
      const words = content.split(/[^a-zA-Z0-9'-]+/);
      let b2 = 0, c1 = 0, c2 = 0;
      const uniqueMatched = new Set();
      
      words.forEach(w => {
        if (!w) return;
        const match = findDictMatch(w, vaultEntries, dictDb);
        if (match) {
          const entry = match.entry;
          const wordKey = entry.word.toLowerCase();
          if (!uniqueMatched.has(wordKey)) {
            uniqueMatched.add(wordKey);
            const level = entry.cefr_level || 'B2';
            if (level === 'B2') b2++;
            else if (level === 'C1') c1++;
            else if (level === 'C2') c2++;
          }
        }
      });
      
      return { b2, c1, c2, total: uniqueMatched.size };
    }

    function ArticleAnalyzer({ 
      articles, 
      setArticles, 
      activeArticleId, 
      setActiveArticleId, 
      entries, 
      setEntries, 
      folders, 
      showToastGlobal, 
      setActiveTab,
      isAddingNew,
      setIsAddingNew
    }) {
      const { useState, useMemo, useEffect, useRef } = React;
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('dateDesc'); // 'dateDesc' | 'dateAsc' | 'title'
      
      // Form state for new article
      const [formTitle, setFormTitle] = useState('');
      const [formSource, setFormSource] = useState('');
      const [formDate, setFormDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [formContent, setFormContent] = useState('');
      const [formImages, setFormImages] = useState([]);
      const [isExtractingPdf, setIsExtractingPdf] = useState(false);
      const [pdfLoadingText, setPdfLoadingText] = useState('Extracting text & images from PDF...');
      const [pdfScannedWarning, setPdfScannedWarning] = useState(false);
      const [pdfOcrError, setPdfOcrError] = useState(null);
      
      // Right sidebar state / Clicked word details
      const [selectedWord, setSelectedWord] = useState(null);
      const [customFolderId, setCustomFolderId] = useState(folders[0]?.id || '');

      // Floating popover state & ref
      const [popoverPosition, setPopoverPosition] = useState(null);
      const popoverRef = useRef(null);

      // Click outside to dismiss word details popover
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (popoverPosition && popoverRef.current && !popoverRef.current.contains(e.target)) {
            if (!e.target.classList.contains('word-highlight')) {
              setPopoverPosition(null);
              setSelectedWord(null);
            }
          }
        };
        document.addEventListener('click', handleClickOutside);
        return () => {
          document.removeEventListener('click', handleClickOutside);
        };
      }, [popoverPosition]);

      // Get active article
      const activeArticle = useMemo(() => {
        return articles.find(a => a.id === activeArticleId) || null;
      }, [articles, activeArticleId]);
      
      // Handle delete article
      const handleDeleteArticle = (id, e) => {
        e.stopPropagation();
        if (confirm("Are you sure you want to delete this article from your library?")) {
          const updated = articles.filter(a => a.id !== id);
          setArticles(updated);
          showToastGlobal("Article deleted from history.");
          if (activeArticleId === id) {
            if (updated.length > 0) {
              setActiveArticleId(updated[0].id);
            } else {
              setActiveArticleId(null);
            }
          }
        }
      };

      // Handle PDF or TXT file upload and text/image extraction
      const handlePdfUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        setPdfScannedWarning(false);
        setPdfOcrError(null);
        
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
          if (file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt')) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              setFormContent(evt.target.result);
              setFormTitle(file.name.replace(/\.[^/.]+$/, ""));
              setFormImages([]);
              showToastGlobal("Text file content imported!");
            };
            reader.readAsText(file);
          } else {
            alert("Please upload a PDF or TXT document.");
          }
          return;
        }
        
        if (typeof pdfjsLib === 'undefined') {
          alert("PDF.js library is still loading. Please try again in a moment.");
          return;
        }
        
        setIsExtractingPdf(true);
        setPdfLoadingText('Loading PDF document structure...');
        setFormTitle(file.name.replace(/\.[^/.]+$/, "")); // Auto fill title with filename
        
        const fileReader = new FileReader();
        fileReader.onload = async function() {
          try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
            
            let fullText = '';
            const extractedImages = [];
            
            for (let i = 1; i <= pdf.numPages; i++) {
              setPdfLoadingText(`Extracting text and images from page ${i} of ${pdf.numPages}...`);
              const page = await pdf.getPage(i);
              
              // Calculate page dimensions to compare with image dimensions
              const viewport = page.getViewport({ scale: 1.0 });
              const pageRatio = viewport.width / viewport.height;
              
              // Extract text
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(item => item.str).join(' ');
              fullText += pageText + '\n\n';
              
              // Extract embedded images from operator list
              try {
                const ops = await page.getOperatorList();
                const fnArray = ops.fnArray;
                const argsArray = ops.argsArray;
                
                for (let j = 0; j < fnArray.length; j++) {
                  if (fnArray[j] === pdfjsLib.OPS.paintImageXObject || fnArray[j] === pdfjsLib.OPS.paintInlineImageXObject) {
                    const imgKey = argsArray[j][0];
                    // 1-second timeout wrapper to prevent locking if image dictionary loading fails
                    const imgObj = await new Promise((resolve) => {
                      const timer = setTimeout(() => resolve(null), 1000);
                      page.objs.get(imgKey, (obj) => {
                        clearTimeout(timer);
                        resolve(obj);
                      });
                    });
                    
                    // Filter out tiny icons, logos, bullets and spacer lines (<120px width/height)
                    if (imgObj && imgObj.width > 120 && imgObj.height > 120) {
                      
                      // Check if the image matches the full page aspect-ratio
                      const imgRatio = imgObj.width / imgObj.height;
                      const ratioDiff = Math.abs(pageRatio - imgRatio);
                      
                      // Heuristic: If aspect ratio matches the page within 4% and it is very large,
                      // it is a scanned page image or full-page background, NOT a figure inside the article.
                      const isFullPageScan = ratioDiff < 0.04 && imgObj.width > 500 && imgObj.height > 500;
                      
                      if (isFullPageScan) {
                        continue; // Skip extracting this text-page image
                      }
                      
                      const canvas = document.createElement('canvas');
                      canvas.width = imgObj.width;
                      canvas.height = imgObj.height;
                      const ctx = canvas.getContext('2d');
                      
                      if (imgObj.data) {
                        const imgData = ctx.createImageData(imgObj.width, imgObj.height);
                        if (imgObj.data.length === imgObj.width * imgObj.height * 4) {
                          imgData.data.set(imgObj.data);
                        } else if (imgObj.data.length === imgObj.width * imgObj.height * 3) {
                          for (let k = 0, l = 0; k < imgObj.data.length; k += 3, l += 4) {
                            imgData.data[l] = imgObj.data[k];
                            imgData.data[l+1] = imgObj.data[k+1];
                            imgData.data[l+2] = imgObj.data[k+2];
                            imgData.data[l+3] = 255;
                          }
                        } else {
                          for (let k = 0, l = 0; k < imgObj.data.length; k++, l += 4) {
                            imgData.data[l] = imgObj.data[k];
                            imgData.data[l+1] = imgObj.data[k];
                            imgData.data[l+2] = imgObj.data[k];
                            imgData.data[l+3] = 255;
                          }
                        }
                        ctx.putImageData(imgData, 0, 0);
                      } else if (imgObj instanceof HTMLCanvasElement || imgObj instanceof ImageBitmap) {
                        ctx.drawImage(imgObj, 0, 0);
                      } else {
                        continue;
                      }
                      
                      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                      // Restrict image count (max 4) and size (~600KB) to respect localStorage quotas
                      if (extractedImages.length < 4 && dataUrl.length < 600000) {
                        extractedImages.push(dataUrl);
                      }
                    }
                  }
                }
              } catch (imgErr) {
                console.warn("Failed to extract images from page " + i, imgErr);
              }
            }
            
            let cleanText = fullText
              .replace(/[ \t\r]+/g, ' ') // Collapse horizontal spaces
              .replace(/\n\s*\n/g, '\n\n') // Keep paragraph breaks
              .replace(/([^\n])\n([^\n])/g, '$1 $2') // Collapse wrap-newlines within a paragraph
              .trim();
            
            setFormContent(cleanText);
            setFormImages(extractedImages);
            
            // Check if PDF text is empty or very short (scanned PDF)
            let isScanned = cleanText.length < 50;
            
            // OCR Flow using Tesseract.js if no text is found
            if (isScanned) {
              setFormImages([]); // Clear page-scanned image blocks to avoid mixing text with page images
              if (typeof Tesseract !== 'undefined') {
                setPdfLoadingText('Scanned PDF detected! Initializing OCR engine...');
                showToastGlobal("Scanned PDF detected. Initiating OCR text recognition...");
                
                let ocrText = '';
                let worker = null;
                const isFileProtocol = window.location.protocol === 'file:';
                const protocolTip = isFileProtocol ? '\n\nTIP: You are opening this app using the file:// protocol. Browsers restrict Web Workers from running from local files. Please run a local web server (e.g. "python3 -m http.server" or VS Code Live Server) to use OCR.' : '';
                
                try {
                  // Initialize Tesseract worker (v4 syntax)
                  worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                      if (m && m.status === 'recognizing text') {
                        const pct = Math.round(m.progress * 100);
                        setPdfLoadingText(`OCR text recognition: ${pct}%`);
                      } else if (m && typeof m.status === 'string') {
                        const cap = m.status.charAt(0).toUpperCase() + m.status.slice(1);
                        setPdfLoadingText(`${cap}...`);
                      }
                    }
                  });
                  
                  for (let i = 1; i <= pdf.numPages; i++) {
                    setPdfLoadingText(`OCR page ${i} of ${pdf.numPages}...`);
                    const page = await pdf.getPage(i);
                    
                    // Render page to canvas at 1.5x resolution for accurate OCR reading
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    // OCR recognition
                    const result = await worker.recognize(canvas);
                    ocrText += result.data.text + '\n\n';
                  }
                  
                  if (ocrText.trim().length > 10) {
                    cleanText = ocrText
                      .replace(/[ \t\r]+/g, ' ')
                      .replace(/\n\s*\n/g, '\n\n')
                      .replace(/([^\n])\n([^\n])/g, '$1 $2')
                      .trim();
                    setFormContent(cleanText); // Auto-pastes the text into the textarea!
                    isScanned = false; // Resolved!
                    setPdfScannedWarning(false);
                    setPdfOcrError(null);
                    showToastGlobal("OCR completed successfully!");
                  } else {
                    setPdfScannedWarning(true);
                    setPdfOcrError("OCR finished but could not extract any text.");
                    showToastGlobal("OCR failed to extract readable text.");
                  }
                } catch (ocrErr) {
                  console.error("OCR execution error:", ocrErr);
                  setPdfScannedWarning(true);
                  let errMsg = ocrErr.message || String(ocrErr);
                  if (isFileProtocol) {
                    errMsg += protocolTip;
                  } else if (errMsg.includes("SetImageFile") || errMsg.includes("null") || errMsg.includes("properties of null")) {
                    errMsg += '\n\nTIP: The Tesseract.js OCR engine core failed to load. This typically happens due to network issues, a blocked connection to the CDN, or an adblocker preventing external WebAssembly scripts from running. Please check your internet connection and disable adblockers for this site.';
                  }
                  setPdfOcrError(errMsg);
                  showToastGlobal("OCR failed: " + (ocrErr.message || "Engine Error"));
                } finally {
                  if (worker) {
                    try {
                      await worker.terminate();
                    } catch (termErr) {
                      console.warn("Failed to terminate worker", termErr);
                    }
                  }
                }
              } else {
                setPdfScannedWarning(true);
                setPdfOcrError("Tesseract.js library is not loaded. Please check your internet connection.");
                showToastGlobal("Scanned PDF detected. Tesseract.js is unavailable.");
              }
            } else {
              setPdfScannedWarning(false);
              showToastGlobal(`PDF parsed! Extracted text and ${extractedImages.length} images.`);
            }
          } catch (err) {
            console.error("Error reading PDF:", err);
            alert("Error parsing PDF file: " + err.message);
          } finally {
            setIsExtractingPdf(false);
          }
        };
        fileReader.readAsArrayBuffer(file);
      };

      // Handle submit new article
      const handleSubmitArticle = (e) => {
        e.preventDefault();
        if (!formTitle.trim() || !formContent.trim()) {
          alert("Please fill in the title and content.");
          return;
        }
        
        const newArt = {
          id: 'art-' + Date.now(),
          title: formTitle.trim(),
          source: formSource.trim() || 'Unknown Source',
          date: formDate || new Date().toISOString().split('T')[0],
          content: formContent.trim(),
          images: formImages,
          created_at: new Date().toISOString()
        };
        
        const updated = [newArt, ...articles];
        setArticles(updated);
        setActiveArticleId(newArt.id);
        setIsAddingNew(false);
        
        // Reset form
        setFormTitle('');
        setFormSource('');
        setFormDate(new Date().toISOString().split('T')[0]);
        setFormContent('');
        setFormImages([]);
        setPdfScannedWarning(false);
        setPdfOcrError(null);
        
        showToastGlobal("Article analyzed and saved!");
      };

      // Filter articles based on search query
      const filteredArticles = useMemo(() => {
        return articles.filter(a => {
          const q = searchQuery.toLowerCase();
          return a.title.toLowerCase().includes(q) || 
                 a.source.toLowerCase().includes(q) || 
                 a.content.toLowerCase().includes(q) ||
                 (a.date && a.date.includes(q));
        });
      }, [articles, searchQuery]);

      // Sort articles
      const sortedArticles = useMemo(() => {
        const sorted = [...filteredArticles];
        if (sortBy === 'dateDesc') {
          sorted.sort((a, b) => new Date(b.date || b.created_at) - new Date(a.date || a.created_at));
        } else if (sortBy === 'dateAsc') {
          sorted.sort((a, b) => new Date(a.date || a.created_at) - new Date(b.date || b.created_at));
        } else if (sortBy === 'title') {
          sorted.sort((a, b) => a.title.localeCompare(b.title));
        }
        return sorted;
      }, [filteredArticles, sortBy]);

      // Group sorted articles by Month and Year
      const groupedArticles = useMemo(() => {
        if (sortBy === 'title') return { "All Articles": sortedArticles };
        
        const groups = {};
        sortedArticles.forEach(a => {
          const dateVal = a.date || a.created_at;
          let monthYearStr = "Unknown Date";
          if (dateVal) {
            const dateObj = new Date(dateVal);
            if (!isNaN(dateObj.getTime())) {
              monthYearStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            }
          }
          if (!groups[monthYearStr]) {
            groups[monthYearStr] = [];
          }
          groups[monthYearStr].push(a);
        });
        return groups;
      }, [sortedArticles, sortBy]);

      // Memoized stats of active article
      const activeArticleStats = useMemo(() => {
        if (!activeArticle) return null;
        return getArticleStats(activeArticle.content, entries, EXTENDED_DICTIONARY_DB);
      }, [activeArticle, entries]);

      // Highlight rendering helper
      const renderReaderText = () => {
        if (!activeArticle) return null;
        const paras = activeArticle.content.split('\n');
        const images = activeArticle.images || [];
        const inlineImages = images.slice(1); // First image is reserved as a cover block at the top
        
        const renderedElements = [];
        
        paras.forEach((pText, pIdx) => {
          if (!pText.trim()) return;
          
          const parts = pText.split(/([a-zA-Z0-9'-]+)/);
          const paragraphElement = (
            <p key={`p-${pIdx}`} className="analyzer-paragraph">
              {parts.map((part, idx) => {
                const isWord = idx % 2 === 1;
                if (!isWord) return part;
                
                const match = findDictMatch(part, entries, EXTENDED_DICTIONARY_DB);
                if (match) {
                  const entry = match.entry;
                  const isSaved = match.isSaved;
                  const level = entry.cefr_level || 'B2';
                  
                  const highlightClass = isSaved 
                    ? 'word-highlight saved' 
                    : `word-highlight ${level.toLowerCase()}`;
                    
                  return (
                    <span 
                      key={idx}
                      className={highlightClass}
                      onClick={(e) => {
                        e.stopPropagation();
                        setSelectedWord(entry);
                        const matchedFolder = folders.find(f => f.name.toLowerCase() === (entry.suggested_folder_name || '').toLowerCase());
                        setCustomFolderId(matchedFolder ? matchedFolder.id : (folders[0]?.id || ''));
                        
                        // Calculate coordinates relative to the #analyzer-reader-container wrapper
                        const rect = e.target.getBoundingClientRect();
                        const container = document.getElementById('analyzer-reader-container');
                        if (container) {
                          const containerRect = container.getBoundingClientRect();
                          const scrollTop = container.scrollTop;
                          const scrollLeft = container.scrollLeft;
                          
                          // Place below the clicked span, centered horizontally
                          const top = rect.bottom - containerRect.top + scrollTop + 10;
                          const left = rect.left - containerRect.left + scrollLeft + (rect.width / 2);
                          setPopoverPosition({ top, left });
                        }
                      }}
                      title={`${entry.word} (${level}) - Click for detail`}
                    >
                      {part}
                    </span>
                  );
                }
                return part;
              })}
            </p>
          );
          
          renderedElements.push(paragraphElement);
          
          // Weave subsequent images inline between paragraphs
          if (inlineImages.length > 0) {
            const totalInline = inlineImages.length;
            const interval = Math.max(1, Math.floor(paras.length / (totalInline + 1)));
            
            if (pIdx > 0 && pIdx < paras.length - 1 && pIdx % interval === 0) {
              const imageIndex = Math.floor(pIdx / interval) - 1;
              if (imageIndex >= 0 && imageIndex < inlineImages.length) {
                const imgUrl = inlineImages[imageIndex];
                renderedElements.push(
                  <figure key={`fig-${pIdx}`} className="analyzer-magazine-figure">

                      src={imgUrl} 
                      alt={`Figure ${imageIndex + 2}`} 
                      className="analyzer-magazine-img"

                        newTab.document.write(`<img src="${imgUrl}" style="max-width:100%; height:auto;" />`);

                      title="Click to zoom image"
                    />
                    <figcaption className="analyzer-magazine-caption">
                      Figure {imageIndex + 2}: Extracted illustration from the document.
                    </figcaption>
                  </figure>
                );
              }
            }
          }
        });
        
        return renderedElements;
      };

                          <div style={{ fontWeight: '700', color: 'var(--text-muted)', marginBottom: '4px', textTransform: 'uppercase', fontSize: '9px', letterSpacing: '0.5px' }}>Word Family</div>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '2px', color: 'var(--text-main)' }}>
                            {selectedWord.word_family.verb?.length > 0 && <div><strong>Verbs:</strong> {selectedWord.word_family.verb.join(', ')}</div>}
                            {selectedWord.word_family.noun?.length > 0 && <div><strong>Nouns:</strong> {selectedWord.word_family.noun.join(', ')}</div>}
                            {selectedWord.word_family.adjective?.length > 0 && <div><strong>Adjectives:</strong> {selectedWord.word_family.adjective.join(', ')}</div>}
                            {selectedWord.word_family.adverb?.length > 0 && <div><strong>Adverbs:</strong> {selectedWord.word_family.adverb.join(', ')}</div>}
                          </div>
                        </div>
                      )}
                      
                      <div style={{ borderTop: '1px solid var(--border-muted)', paddingTop: '8px', marginTop: '4px' }}>
                        {isWordSaved ? (
                          <div style={{ fontSize: '11px' }}>
                            <div style={{ color: '#10B981', fontWeight: '700', marginBottom: '4px', display: 'flex', alignItems: 'center', gap: '3px' }}>
                              ✓ Saved to Vault
                            </div>
                            {savedEntryObj && savedEntryObj.stats && (
                              <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-muted)' }}>
                                <span>Stats: {savedEntryObj.stats.encounters} enc / {savedEntryObj.stats.correct} ok / {savedEntryObj.stats.incorrect} err</span>
                              </div>
                            )}
                          </div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            <div style={{ display: 'flex', gap: '4px', alignItems: 'center' }}>
                              <label style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: '700', marginRight: '4px' }}>Folder:</label>
                              <select 
                                className="review-filter-select"
                                style={{ padding: '2px 4px', fontSize: '11px', height: '24px', flexGrow: 1 }}
                                value={customFolderId}
                                onChange={(e) => {
                                  e.stopPropagation();
                                  setCustomFolderId(e.target.value);
                                }}
                                onClick={(e) => e.stopPropagation()}
                              >
                                {folders.map(f => (
                                  <option key={f.id} value={f.id}>
                                    {f.emoji} {f.name}
                                  </option>
                                ))}
                              </select>
                            </div>
                            <button 
                              type="button"
                              className="btn btn-primary"
                              style={{ width: '100%', height: '26px', fontSize: '12px', padding: '0 8px' }}
                              onClick={(e) => {
                                e.stopPropagation();
                                handleAddWordToVault();
                              }}
                            >
                              📥 Add to Vault
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div className="empty-state" style={{ flexGrow: 1, border: 'none' }}>
                <span className="empty-icon">📰</span>
                <h3 className="empty-title">No Article Selected</h3>
                <p className="empty-desc">Choose an article from the library or add a new one to begin reading and identifying key academic vocabulary.</p>
                <button className="btn btn-primary" style={{ marginTop: '16px' }} onClick={() => setIsAddingNew(true)}>
                  Analyze First Article
                </button>
              </div>
            )}
          </div>

          <div className="analyzer-right-panel">
            {selectedWord ? (
              <div style={{ padding: '24px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '24px', fontWeight: '700', color: 'var(--accent)' }}>
                    {selectedWord.word}
                  </h3>
                  
                  <span 
                    className={`badge cefr-${selectedWord.cefr_level || 'B2'}`} 
                    style={{ 
                      fontSize: '13px', 
                      fontWeight: '700', 
                      padding: '4px 8px',
                      borderRadius: '4px'
                    }}
                  >
                    {selectedWord.cefr_level || 'B2'}
                  </span>
                </div>
                
                <div style={{ display: 'flex', gap: '12px', color: 'var(--text-muted)', fontSize: '13.5px', marginBottom: '20px', borderBottom: '1px solid var(--border-muted)', paddingBottom: '12px' }}>
                  {selectedWord.ipa_uk && (
                    <span>UK: <strong>{selectedWord.ipa_uk}</strong></span>
                  )}
                  {selectedWord.ipa_us && (
                    <span>US: <strong>{selectedWord.ipa_us}</strong></span>
                  )}
                  {selectedWord.register && (
                    <span className="badge" style={{ backgroundColor: '#F1F5F9', color: 'var(--text-muted)', fontSize: '10px', padding: '1px 4px' }}>
                      {selectedWord.register}
                    </span>
                  )}
                </div>
                
                <div style={{ marginBottom: '24px' }}>
                  <h4 style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: '700', letterSpacing: '0.5px', marginBottom: '8px' }}>Definitions</h4>
                  {selectedWord.definitions && selectedWord.definitions.length > 0 ? (
                    selectedWord.definitions.map((def, idx) => (
                      <div key={idx} style={{ marginBottom: '16px', backgroundColor: 'var(--bg-app)', padding: '12px', borderRadius: '6px', border: '1px solid var(--border-muted)' }}>
                        <div style={{ fontStyle: 'italic', fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>
                          {def.grammar_note || 'word'} • CEFR {def.cefr_level || 'B2'}
                        </div>
                        <div style={{ fontSize: '14px', fontWeight: '500', color: 'var(--text-main)', lineHeight: '1.4' }}>
                          {def.definition}
                        </div>
                        {def.example && (
                          <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '8px', borderLeft: '2px solid var(--accent)', paddingLeft: '8px', fontStyle: 'italic' }}>
                            "{def.example}"
                          </div>
                        )}
                      </div>
                    ))
                  ) : (
                    <div style={{ fontSize: '14px', color: 'var(--text-main)' }}>{selectedWord.definition}</div>
                  )}
                </div>
                
                {selectedWord.word_family && (
                  <div style={{ marginBottom: '24px' }}>
                    <h4 style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: '700', letterSpacing: '0.5px', marginBottom: '8px' }}>Word Family</h4>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', fontSize: '13px' }}>
                      {selectedWord.word_family.verb?.length > 0 && (
                        <div><strong style={{ color: 'var(--text-muted)' }}>Verbs:</strong> {selectedWord.word_family.verb.join(', ')}</div>
                      )}
                      {selectedWord.word_family.noun?.length > 0 && (
                        <div><strong style={{ color: 'var(--text-muted)' }}>Nouns:</strong> {selectedWord.word_family.noun.join(', ')}</div>
                      )}
                      {selectedWord.word_family.adjective?.length > 0 && (
                        <div><strong style={{ color: 'var(--text-muted)' }}>Adjectives:</strong> {selectedWord.word_family.adjective.join(', ')}</div>
                      )}
                      {selectedWord.word_family.adverb?.length > 0 && (
                        <div><strong style={{ color: 'var(--text-muted)' }}>Adverbs:</strong> {selectedWord.word_family.adverb.join(', ')}</div>
                      )}
                    </div>
                  </div>
                )}
                
                {selectedWord.register_synonyms && selectedWord.register_synonyms.length > 0 && (
                  <div style={{ marginBottom: '24px' }}>
                    <h4 style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: '700', letterSpacing: '0.5px', marginBottom: '8px' }}>Synonyms & Registers</h4>
                    <div className="synonyms-chips">
                      {selectedWord.register_synonyms.map((syn, idx) => (
                        <span key={idx} className="synonym-chip">
                          {syn.word}
                          <span className="synonym-meta">{syn.register || 'neutral'}</span>
                        </span>
                      ))}
                    </div>
                  </div>
                )}
                
                <div style={{ borderTop: '2px solid var(--border-strong)', paddingTop: '20px', marginTop: '20px' }}>
                  {isWordSaved ? (
                    <div>
                      <div className="badge" style={{ backgroundColor: 'var(--mint-light)', color: '#10B981', border: '1px solid #10B981', display: 'inline-flex', alignItems: 'center', gap: '4px', marginBottom: '12px', fontSize: '12.5px', padding: '4px 8px' }}>
                        ✓ Word Saved in Vault
                      </div>
                      
                      {savedEntryObj && savedEntryObj.stats && (
                        <div style={{ backgroundColor: 'var(--bg-app)', border: '1px solid var(--border-muted)', borderRadius: '6px', padding: '12px', fontSize: '13px' }}>
                          <div style={{ fontWeight: '700', color: 'var(--text-main)', marginBottom: '8px' }}>Learning Statistics:</div>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                            <span>Total Encounters:</span>
                            <strong style={{ color: 'var(--accent)' }}>{savedEntryObj.stats.encounters || 0}</strong>
                          </div>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                            <span>Correct Answers:</span>
                            <strong style={{ color: '#10B981' }}>{savedEntryObj.stats.correct || 0}</strong>
                          </div>
                          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                            <span>Incorrect Answers:</span>
                            <strong style={{ color: '#EF4444' }}>{savedEntryObj.stats.incorrect || 0}</strong>
                          </div>
                          
                          {savedEntryObj.source_context && (
                            <div style={{ borderTop: '1px solid var(--border-muted)', marginTop: '8px', paddingTop: '8px', fontSize: '11.5px', color: 'var(--text-muted)' }}>
                              First encountered: <em>{savedEntryObj.source_context}</em>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div>
                      <div className="review-filter-group" style={{ marginBottom: '16px' }}>
                        <label>Save to Vault Folder</label>
                        <select 
                          className="review-filter-select"
                          value={customFolderId}
                          onChange={(e) => setCustomFolderId(e.target.value)}
                        >
                          {folders.map(f => (
                            <option key={f.id} value={f.id}>
                              {f.emoji} {f.name}
                            </option>
                          ))}
                        </select>
                      </div>
                      
                      <button 
                        className="btn btn-primary" 
                        style={{ width: '100%' }}
                        onClick={handleAddWordToVault}
                      >
                        📥 Add to Vault
                      </button>
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', padding: '24px', textAlign: 'center', color: 'var(--text-muted)' }}>
                <Icon name="info" style={{ fontSize: '32px', marginBottom: '12px' }} />
                <h4>No Word Selected</h4>
                <p style={{ fontSize: '13px', marginTop: '6px' }}>Click on any highlighted word in the article to view Cambridge definitions, registers, word family, and save it directly to your vocabulary folders.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Bind App to UI root elements
    ReactDOM.render(<App />, document.getElementById('app-root'));
  </script>

</body>
</html>
